<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>S-TECH 금리·유가</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
  <link href="../assets/did.css" rel="stylesheet"/>
  <style>
    /* ════════════════════════════
       그룹 · 행
    ════════════════════════════ */
    .groups { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 40px 64px 0; }
    .group { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .group + .group { margin-top: 34px; }

    .rows { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .row {
      flex: 1; min-height: 0;
      display: flex; align-items: center;
      padding: 0 34px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.018));
      border: 1px solid rgba(255,255,255,.065);
    }
    .row + .row { margin-top: 14px; }

    .r-left { width: 250px; flex-shrink: 0; }
    .r-name { font-size: 2.6rem; font-weight: 800; letter-spacing: -.02em; color: #f1f4f8; line-height: 1.1; }
    .r-sub { font-size: 1.2rem; color: #5b6576; margin-top: 6px; }

    .r-chart { flex: 1; min-width: 0; margin: 0 30px; align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
    .chart { position: relative; height: 112px; }
    .chart svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
    .chart .dot {
      position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
      border: 3px solid #0b0e14;
    }
    .chart-axis { display: flex; justify-content: space-between; margin-top: 10px; font-size: 1.02rem; color: #4a5263; font-variant-numeric: tabular-nums; }

    .r-right { width: 300px; flex-shrink: 0; text-align: right; }
    .r-value {
      font-size: 5.4rem; font-weight: 800; letter-spacing: -.03em; line-height: 1;
      color: #ffffff; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden;
    }
    .r-value .u { font-size: .42em; font-weight: 600; color: #7b8494; letter-spacing: 0; margin-left: 4px; }
    .r-value .p { font-size: .42em; font-weight: 600; color: #7b8494; letter-spacing: 0; margin-right: 4px; }
    .r-value.na { color: #2b3240; }
    .r-chg { margin-top: 12px; }
    .r-asof { font-size: 1.1rem; color: #4a5263; margin-top: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .r-asof.stale { color: #f5b041; font-weight: 700; }

  </style>
</head>
<body>
<div class="screen">

  <div class="topbar"></div>
  <div class="hdr">
    <div class="brand">
      <img class="logo" src="../assets/logo.gif" alt="S-TECH"/>
      <div class="brand-txt">
        <div class="eyebrow">MARKET WATCH</div>

      </div>
    </div>
    <div class="clock">
      <div class="clock-time" id="koTime">--:--:--</div>

  </div>

  <div class="groups">
    <!-- 국제 유가 -->
    <div class="group">
      <div class="sec-head">
        <div class="sec-title"><span class="sec-bar"></span><span class="sec-name">국제 유가</span><span class="sec-en">CRUDE OIL</span></div>
        <div class="sec-meta">USD / 배럴</div>
      </div>
      <div class="rows">
        <div class="row" id="rowBrent"></div>
        <div class="row" id="rowWti"></div>
      </div>
    </div>

    <!-- 기준금리 -->
    <div class="group">
      <div class="sec-head">
        <div class="sec-title"><span class="sec-bar"></span><span class="sec-name">기준금리</span><span class="sec-en">POLICY RATE</span></div>
      </div>
      <div class="rows">
        <div class="row" id="rowKrBase"></div>
        <div class="row" id="rowUsBase"></div>
      </div>
    </div>

    <!-- 국채 10년물 -->
    <div class="group">
      <div class="sec-head">
        <div class="sec-title"><span class="sec-bar"></span><span class="sec-name">국채 10년물</span><span class="sec-en">10Y YIELD</span></div>
      </div>
      <div class="rows">
        <div class="row" id="rowKr10"></div>
        <div class="row" id="rowUs10"></div>
      </div>

  </div>

  <!-- ── FOOTER ── -->
  <div class="footer">
    <div class="footer-left" id="upBox"><div class="footer-dot"></div><span id="upTxt">불러오는 중</span></div>
    <div>출처: 한국은행 · 미 재무부 · 뉴욕 연준 · Yahoo Finance</div>
  </div>
</div>

<script>
// 구형 DID 플레이어(옛 Android WebView / Tizen 등) 호환을 위해 ES5 문법만 사용

// GitHub Actions(market-data.yml)가 갱신하는 파일. 예약 실행이 몇 시간씩 밀릴 수 있다.
var DATA_URL = 'https://raw.githubusercontent.com/jiyeon9047/stech1/market-data/markets.json';
var CACHE_KEY = 'stech-markets';

// 값마다 바뀌는 주기가 달라서 '오래됨' 기준도 따로 둔다. 오래된 행은 기준 시각이 주황색이 된다.
var HOUR = 60 * 60 * 1000, DAY = 24 * HOUR;
var OIL_STALE_MS = 3 * HOUR;    // 유가: 장이 열려 있는데 가격이 3시간 넘게 멈춰 있으면
var YIELD_STALE_DAYS = 4;       // 국채: 종가 날짜가 4일 넘게 지났으면(주말·휴일 감안)
var BASE_STALE_MS = 3 * DAY;    // 기준금리: 3일 넘게 확인하지 못했으면

var ROWS = [
  { id: 'Brent',  key: 'brent',  kind: 'oil',   name: '브렌트유', sub: 'Brent · ICE',    color: '#cfd4dd' },
  { id: 'Wti',    key: 'wti',    kind: 'oil',   name: 'WTI',     sub: 'NYMEX',          color: '#cfd4dd' },
  { id: 'KrBase', key: 'krBase', kind: 'base',  name: '한국',     sub: '한국은행',         color: '#cfd4dd' },
  { id: 'UsBase', key: 'usBase', kind: 'base',  name: '미국',     sub: '연준 목표 범위',    color: '#cfd4dd' },
  { id: 'Kr10',   key: 'kr10y',  kind: 'yield', name: '한국',     sub: '국고채',           color: '#cfd4dd', digits: 3 },
  { id: 'Us10',   key: 'us10y',  kind: 'yield', name: '미국',     sub: 'Treasury',        color: '#cfd4dd', digits: 2 }
];

// 간단한 JSON GET (fetch 미지원 환경 대비 XHR 사용)
function getJSON(url, cb) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', url + (url.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now(), true);
    x.timeout = 15000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        try { cb(null, JSON.parse(x.responseText)); } catch (e) { cb(e); }
      } else {
        cb(new Error('HTTP ' + x.status));
      }
    };
    x.onerror = function () { cb(new Error('network')); };
    x.ontimeout = function () { cb(new Error('timeout')); };
    x.send();
  } catch (e) { cb(e); }
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function $(id) { return document.getElementById(id); }
function fix(n, d) { return Number(n).toFixed(d); }

// 한국 시각 { y, mo, d, h, m, s, day }. 한국은 서머타임이 없어 +9시간 폴백으로 충분하다.
var tzSupported = (function () {
  try { new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }); return true; } catch (e) { return false; }
})();
function seoul(t) {
  var now = t ? new Date(t) : new Date();
  if (tzSupported) {
    var str = now.toLocaleString('en-US', {
      timeZone: 'Asia/Seoul', hour12: false, year: 'numeric', month: 'numeric', day: 'numeric',
      hour: 'numeric', minute: 'numeric', second: 'numeric'
    });
    var m = str.match(/(\d+)\/(\d+)\/(\d+),?\s+(\d+):(\d+):(\d+)/);
    if (m) {
      var h = parseInt(m[4], 10); if (h === 24) h = 0;
      var dt = new Date(parseInt(m[3], 10), parseInt(m[1], 10) - 1, parseInt(m[2], 10));
      return { y: +m[3], mo: +m[1], d: +m[2], h: h, m: +m[5], s: +m[6], day: dt.getDay() };
    }
  }
  var k = new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
  return { y: k.getFullYear(), mo: k.getMonth() + 1, d: k.getDate(), h: k.getHours(), m: k.getMinutes(), s: k.getSeconds(), day: k.getDay() };
}

var WD = ['일', '월', '화', '수', '목', '금', '토'];
function updateClock() {
  var z = seoul();
  $('koTime').textContent = pad2(z.h) + ':' + pad2(z.m) + ':' + pad2(z.s);
  $('koDate').textContent = z.y + '년 ' + z.mo + '월 ' + z.d + '일 (' + WD[z.day] + ')';
}

// "2026-11-06" -> "11.06", "2026-08" -> "26.08", ISO 시각 -> 한국 시각 "11.09 16:33"
function shortDate(s) {
  if (!s) return '';
  return s.length >= 10 ? s.substr(5, 2) + '.' + s.substr(8, 2) : s.substr(2, 2) + '.' + s.substr(5, 2);
}
function fullDate(s) { return s ? s.replace(/-/g, '.') : ''; }
function fmtTime(iso) {
  var t = Date.parse(iso);
  if (isNaN(t)) return '';
  var z = seoul(t);
  return pad2(z.mo) + '.' + pad2(z.d) + ' ' + pad2(z.h) + ':' + pad2(z.m);
}

// ── 오래됨 판정 ──
// 해당 월의 n번째(n=-1 이면 마지막) 일요일 0시(UTC 기준 날짜)의 ms
function sundayUTC(y, mo, n) {
  if (n > 0) {
    var first = new Date(Date.UTC(y, mo, 1)).getUTCDay();
    return Date.UTC(y, mo, 1 + (7 - first) % 7 + 7 * (n - 1));
  }
  var last = new Date(Date.UTC(y, mo + 1, 0));
  return Date.UTC(y, mo, last.getUTCDate() - last.getUTCDay());
}
// 뉴욕 시각의 { day(0~6), h }. 서머타임(3월 둘째 일요일 02:00 ~ 11월 첫째 일요일 02:00)을 직접 계산한다.
function newYork(t) {
  var y = new Date(t).getUTCFullYear(), H = 3600000;
  var dst = t >= sundayUTC(y, 2, 2) + 7 * H && t < sundayUTC(y, 10, 1) + 6 * H;
  var e = new Date(t + (dst ? -4 : -5) * H);
  return { day: e.getUTCDay(), h: e.getUTCHours() };
}
// 유가 선물 거래 시간(뉴욕): 일 18:00 ~ 금 17:00, 매일 17:00~18:00 휴장
function oilOpen(t) {
  var n = newYork(t);
  if (n.day === 6) return false;
  if (n.day === 5 && n.h >= 17) return false;
  if (n.day === 0 && n.h < 18) return false;
  return n.h !== 17;
}
function isStale(row, d, data) {
  var now = Date.now();
  if (row.kind === 'oil') {
    var pt = Date.parse(d.time);
    // 장이 3시간 넘게 계속 열려 있었는데도 가격이 3시간 넘게 그대로일 때만
    return !isNaN(pt) && oilOpen(now) && oilOpen(now - OIL_STALE_MS) && now - pt > OIL_STALE_MS;
  }
  if (row.kind === 'yield') {
    if (!d.date) return false;
    var z = seoul(), today = Date.UTC(z.y, z.mo - 1, z.d);
    var p = d.date.split('-'), day = Date.UTC(+p[0], +p[1] - 1, +p[2]);
    return (today - day) / DAY > YIELD_STALE_DAYS;
  }
  // 기준금리: 항목별 마지막 성공 시각, 예전 데이터면 파일 갱신 시각
  var f = Date.parse(d.fetched || data.updated);
  return isNaN(f) || now - f > BASE_STALE_MS;
}

function pill(diff, text) {
  var cls = diff > 0.00001 ? 'up' : (diff < -0.00001 ? 'down' : 'flat');
  var arrow = cls === 'up' ? '▲ ' : (cls === 'down' ? '▼ ' : '');
  return '<span class="pill ' + cls + '">' + (cls === 'flat' ? '변동 없음' : arrow + text) + '</span>';
}

// 추이 그래프. 기준금리는 계단형, 나머지는 선형. 점은 찌그러지지 않게 HTML로 따로 찍는다.
function chart(row, hist) {
  if (!hist || hist.length < 2) return '<div class="chart"></div><div class="chart-axis"><span></span><span></span></div>';
  var W = 400, H = 100, n = hist.length, lo = Infinity, hi = -Infinity, i;
  for (i = 0; i < n; i++) { lo = Math.min(lo, hist[i][1]); hi = Math.max(hi, hist[i][1]); }
  var pad = (hi - lo) * 0.12 || 0.5;
  lo -= pad; hi += pad;
  function X(i) { return i / (n - 1) * W; }
  function Y(v) { return H - (v - lo) / (hi - lo) * H; }
  var line = 'M' + X(0).toFixed(1) + ' ' + Y(hist[0][1]).toFixed(1);
  for (i = 1; i < n; i++) {
    if (row.kind === 'base') line += ' H' + X(i).toFixed(1) + ' V' + Y(hist[i][1]).toFixed(1);
    else line += ' L' + X(i).toFixed(1) + ' ' + Y(hist[i][1]).toFixed(1);
  }
  var area = line + ' L' + W + ' ' + H + ' L0 ' + H + ' Z';
  var gid = 'g' + row.id;
  var last = hist[n - 1][1];
  return '<div class="chart">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
        '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="' + row.color + '" stop-opacity=".32"/>' +
          '<stop offset="1" stop-color="' + row.color + '" stop-opacity="0"/>' +
        '</linearGradient></defs>' +
        '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
        '<path d="' + line + '" fill="none" stroke="' + row.color + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      '</svg>' +
      '<span class="dot" style="left:100%;top:' + (Y(last) / H * 100).toFixed(1) + '%;background:' + row.color + ';box-shadow:0 0 14px ' + row.color + '"></span>' +
    '</div>' +
    '<div class="chart-axis"><span>' + shortDate(hist[0][0]) + '</span><span>' + shortDate(hist[n - 1][0]) + '</span></div>';
}

function renderRow(row, d, data) {
  var value = '<div class="r-value na">--</div>', chg = '', asof = '', stale = false;
  if (d) {
    if (row.kind === 'oil' && d.price != null) {
      var diff = d.price - d.prev;
      value = '<div class="r-value"><span class="p">$</span>' + fix(d.price, 2) + '</div>';
      chg = pill(diff, fix(Math.abs(diff), 2) + '  ' + (diff >= 0 ? '+' : '−') + fix(Math.abs(diff / d.prev * 100), 2) + '%');
      asof = fmtTime(d.time);
    } else if (row.kind === 'yield' && d['yield'] != null) {
      var bp = (d['yield'] - d.prev) * 100;
      value = '<div class="r-value">' + fix(d['yield'], row.digits) + '<span class="u">%</span></div>';
      chg = pill(bp, fix(Math.abs(bp), 1) + 'bp');
      asof = shortDate(d.date) + ' 기준';
    } else if (row.kind === 'base' && (d.rate != null || d.upper != null)) {
      var v = d.rate != null ? fix(d.rate, 2) : fix(d.lower, 2) + '–' + fix(d.upper, 2);
      value = '<div class="r-value">' + v + '<span class="u">%</span></div>';
      // change 가 null 이면 조회 기간 안에 변경이 없었던 것, 없으면(예전 데이터) 표시하지 않는다
      if (d.change) {
        chg = pill(d.change.delta, fix(Math.abs(d.change.delta), 2) + '%p');
        asof = '최근 변경 ' + fullDate(d.change.date);
      } else if (d.change === null) {
        chg = pill(0, '');
      }
    }
    stale = isStale(row, d, data);
    if (stale) asof = (asof ? asof + ' · ' : '') + '갱신 지연';
  }
  $('row' + row.id).innerHTML =
    '<div class="r-left"><div class="r-name">' + row.name + '</div><div class="r-sub">' + row.sub + '</div></div>' +
    '<div class="r-chart">' + chart(row, d && d.hist) + '</div>' +
    '<div class="r-right">' + value + '<div class="r-chg">' + chg + '</div><div class="r-asof' + (stale ? ' stale' : '') + '">' + asof + '</div></div>';
  return stale;
}

// 값이 오른쪽 칸 폭을 넘으면 넘지 않을 때까지 줄인다 (미국 기준금리 범위 등)
function fitValues() {
  var vals = document.querySelectorAll('.r-value');
  for (var i = 0; i < vals.length; i++) {
    var el = vals[i];
    el.style.fontSize = '';
    var size = parseFloat(window.getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth && size > 40) {
      size -= 3;
      el.style.fontSize = size + 'px';
    }
  }
}

function render(data) {
  var staleRows = 0;
  for (var i = 0; i < ROWS.length; i++) if (renderRow(ROWS[i], data[ROWS[i].key], data)) staleRows++;
  fitValues();
  // 하단은 마지막 수집 시각만 알리고, 오래된 행이 있을 때만 주황색
  var up = Date.parse(data.updated);
  $('upTxt').textContent = isNaN(up) ? '업데이트 정보 없음'
    : '업데이트 ' + fmtTime(data.updated) + (staleRows ? ' · ' + staleRows + '개 항목 갱신 지연' : '');
  $('upBox').className = 'footer-left' + (isNaN(up) || staleRows ? ' stale' : '');
}

var lastData = null;
function loadData() {
  getJSON(DATA_URL, function (err, d) {
    if (err || !d) return;
    lastData = d;
    render(d);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) {}
  });
}

// 네트워크가 늦거나 끊겨도 마지막으로 받은 값을 먼저 보여준다
try {
  var cached = localStorage.getItem(CACHE_KEY);
  if (cached) { lastData = JSON.parse(cached); }
} catch (e) {}
render(lastData || {});

updateClock();
setInterval(updateClock, 1000);
loadData();
setInterval(loadData, 5 * 60 * 1000);
// 웹폰트가 늦게 적용돼 숫자 폭이 바뀌는 경우와, 갱신이 멈췄을 때 주황색 표시를 위해 1분마다 다시 그린다
window.addEventListener('load', function () { render(lastData || {}); });
setInterval(function () { render(lastData || {}); }, 60 * 1000);

// 1080x1920 디자인을 뷰포트의 가로/세로에 각각 꽉 맞춘다(비율 무시, 여백 없음).
// xtrmCAST 플레이어(가로형 설정)는 웹페이지를 세로 패널과 다른 비율의 영역에
// 그리므로, 여백 없이 채우는 것을 우선한다. 일반 브라우저에서는 찌그러져 보일 수 있다.
// 플레이어가 쿼리스트링을 떼어낼 수 있으므로 #debug=1 형태도 허용한다.
var URL_FLAGS = window.location.search + window.location.hash;
// ?debug=1 : 플레이어 브라우저가 보고하는 뷰포트 값과 뷰포트 경계를 화면에 표시
var DEBUG_MODE = /[?&#]debug=1/.test(URL_FLAGS);

function fitScreen() {
  // CSS 퍼센트가 기준으로 삼는 레이아웃 뷰포트를 우선 사용한다.
  // (window.innerWidth 는 스크롤바/줌/에뮬레이션에서 어긋날 수 있음)
  var d = document.documentElement;
  var w = d.clientWidth || window.innerWidth;
  var h = d.clientHeight || window.innerHeight;
  if (!w || !h) return; // 뷰포트가 0인 상태(숨김/프리로드)에서는 건너뜀
  var sx = w / 1080;
  var sy = h / 1920;
  var el = document.querySelector('.screen');
  var t = 'scale(' + sx + ', ' + sy + ')'; // transform-origin 0 0 기준
  el.style.webkitTransform = t;
  el.style.transform = t;
  if (DEBUG_MODE) renderDebug();
}

function renderDebug() {
  var box = document.getElementById('dbg');
  if (!box) {
    // 자홍색 테두리 = 페이지가 받은 뷰포트의 실제 경계
    var frame = document.createElement('div');
    frame.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;' +
      'border:8px solid #ff00ff;z-index:9998;pointer-events:none;';
    document.body.appendChild(frame);
    box = document.createElement('div');
    box.id = 'dbg';
    box.style.cssText = 'position:fixed;left:16px;top:16px;right:16px;z-index:9999;' +
      'background:rgba(0,0,0,.85);color:#00ff66;font-family:monospace;' +
      'white-space:pre-wrap;word-break:break-all;padding:12px;line-height:1.35;';
    document.body.appendChild(box);
  }
  var d = document.documentElement;
  var el = document.querySelector('.screen');
  var r = el.getBoundingClientRect();
  var ds = d.style;
  box.style.fontSize = Math.max(12, Math.round(Math.min(d.clientWidth, d.clientHeight) / 26)) + 'px';
  box.textContent = [
    'inner   ' + window.innerWidth + ' x ' + window.innerHeight,
    'client  ' + d.clientWidth + ' x ' + d.clientHeight,
    'screen  ' + screen.width + ' x ' + screen.height,
    'dpr     ' + (window.devicePixelRatio || 1),
    'flags   ' + (URL_FLAGS || '(없음)'),
    'tf-css  ' + (('transform' in ds) || ('webkitTransform' in ds)),
    'content ' + Math.round(r.left) + ',' + Math.round(r.top) + '  ' +
      Math.round(r.right - r.left) + ' x ' + Math.round(r.bottom - r.top),
    'data    ' + (lastData ? lastData.updated + ' errors=' + (lastData.errors || []).length : '(없음)'),
    'ua      ' + navigator.userAgent
  ].join('\n');
}
window.addEventListener('resize', fitScreen);
window.addEventListener('orientationchange', fitScreen);
window.addEventListener('load', fitScreen);
document.addEventListener('visibilitychange', fitScreen);
setInterval(fitScreen, 1000); // 일부 DID 플레이어는 resize 이벤트를 안 보냄
fitScreen();
</script>
</body>
</html>
