<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>S-TECH DID 모니터</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
  <link href="assets/did.css" rel="stylesheet"/>
  <style>
    /* 국기: flag-icons(4:3 SVG). 못 불러오면 이모지로 대체 */
    .flag {
      width: 72px; height: 54px; border-radius: 8px; overflow: hidden; flex-shrink: 0;
      background: #1a1f29; box-shadow: 0 0 0 1px rgba(255,255,255,.1);
      display: flex; align-items: center; justify-content: center; font-size: 2.6rem;
    }
    .flag img { width: 100%; height: 100%; display: block; object-fit: cover; }

    /* ════════════════════════════
       환율
    ════════════════════════════ */
    .fx { flex-shrink: 0; position: relative; overflow: hidden; padding: 38px 48px 40px; }
    .fx::before { content: ''; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: #d9222f; }
    .fx-top { display: flex; align-items: center; justify-content: space-between; }
    .fx-id { display: flex; align-items: center; }
    .fx-id-txt { margin-left: 22px; }
    .fx-pair { font-size: 2.6rem; font-weight: 800; letter-spacing: .02em; color: #f3f5f8; line-height: 1.1; }
    .fx-desc { font-size: 1.3rem; color: #6b7384; margin-top: 4px; }
    .live {
      display: inline-flex; align-items: center;
      border: 1px solid rgba(52,211,153,.35); background: rgba(52,211,153,.1);
      border-radius: 999px; padding: 7px 18px;
      font-size: 1.15rem; font-weight: 700; letter-spacing: .12em; color: #34d399;
    }
    .live .footer-dot { margin-right: 9px; }
    .fx-bottom { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 26px; }
    .fx-val { font-size: 9.5rem; font-weight: 800; letter-spacing: -.04em; line-height: .95; color: #ffffff; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .fx-val .won { font-size: .4em; font-weight: 700; color: #f2525b; letter-spacing: 0; margin-right: 12px; vertical-align: .9em; }
    .fx-val .unit { font-size: .3em; font-weight: 600; color: #6b7384; letter-spacing: 0; margin-left: 12px; }
    .fx-side { text-align: right; padding-bottom: 10px; }
    .fx-time { font-size: 1.15rem; color: #454d5c; margin-top: 12px; font-variant-numeric: tabular-nums; }

    /* ════════════════════════════
       도시별 날씨 · 시각
    ════════════════════════════ */
    .world { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 40px; }
    .cols, .city { display: flex; align-items: center; }
    .c-name { flex: 1; min-width: 0; }
    .c-wx   { width: 150px; text-align: center; }
    .c-temp { width: 170px; text-align: center; }
    .c-time { width: 230px; text-align: right; }
    .cols { flex-shrink: 0; padding: 0 36px 12px; }
    .cols > div { font-size: 1.15rem; font-weight: 600; letter-spacing: .08em; color: #454d5c; }

    .cities { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .city { flex: 1; min-height: 0; padding: 0 36px; }
    .city + .city { margin-top: 12px; }
    .city.hl { background: linear-gradient(90deg, rgba(217,34,47,.16), rgba(217,34,47,.04)); border-color: rgba(217,34,47,.4); }
    .city .c-name { display: flex; align-items: center; }
    .c-label { margin-left: 22px; min-width: 0; }
    .c-city { font-size: 2.4rem; font-weight: 800; letter-spacing: -.02em; color: #f3f5f8; line-height: 1.1; white-space: nowrap; }
    .c-country { font-size: 1.15rem; color: #6b7384; margin-top: 4px; }
    .city.hl .c-country { color: #f2525b; }
    .c-wx svg { width: 52px; height: 52px; display: inline-block; vertical-align: middle; }
    .c-temp { font-size: 3rem; font-weight: 800; letter-spacing: -.02em; color: #f3f5f8; font-variant-numeric: tabular-nums; }
    .c-temp .u { font-size: .5em; font-weight: 600; color: #6b7384; margin-left: 2px; }
    .c-temp.na { color: #2b3240; }
    .c-hm { font-size: 3rem; font-weight: 700; color: #f3f5f8; font-variant-numeric: tabular-nums; line-height: 1.05; }
    .c-day { font-size: 1.15rem; color: #6b7384; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .c-day.diff { color: #f5b041; }
  </style>
</head>
<body>
<div class="screen">
  <div class="topbar"></div>
  <div class="hdr">
    <div class="brand">
      <img class="logo" src="assets/logo.gif" alt="S-TECH"/>
      <div class="brand-txt">
        <div class="eyebrow">GLOBAL WATCH</div>
        <div class="title">환율 · 세계 시각</div>
      </div>
    </div>
    <div class="clock">
      <div class="clock-time" id="koTime">--:--:--</div>
      <div class="clock-date" id="koDate">—</div>
    </div>
  </div>

  <div class="main">
    <!-- 환율 -->
    <div class="panel fx">
      <div class="fx-top">
        <div class="fx-id">
          <div class="flag"><img src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/us.svg" alt="" onerror="this.parentNode.innerHTML='🇺🇸'"/></div>
          <div class="fx-id-txt">
            <div class="fx-pair">USD / KRW</div>
            <div class="fx-desc">미국 달러 → 원화 · 실시간 매매 기준</div>
          </div>
        </div>
        <div class="live"><span class="footer-dot"></span>LIVE</div>
      </div>
      <div class="fx-bottom">
        <div class="fx-val"><span class="won">₩</span><span id="rateVal">——</span><span class="unit">원</span></div>
        <div class="fx-side">
          <div id="rateChg"><span class="pill flat">불러오는 중</span></div>
          <div class="fx-time" id="rateTime">&nbsp;</div>
        </div>
      </div>
    </div>

    <!-- 도시별 날씨 · 시각 -->
    <div class="world">
      <div class="sec-head">
        <div class="sec-title"><span class="sec-bar"></span><span class="sec-name">현지 날씨 · 시각</span><span class="sec-en">WORLD CLOCK</span></div>
      </div>
      <div class="cols">
        <div class="c-name">도시</div><div class="c-wx">날씨</div><div class="c-temp">기온</div><div class="c-time">현지 시각</div>
      </div>
      <div class="cities" id="cityRows"></div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left"><div class="footer-dot"></div>실시간 업데이트 중</div>
    <div>환율·날씨 정보는 참고용입니다</div>
  </div>
</div>

<script>
// 구형 DID 플레이어(옛 Android WebView / Tizen 등) 호환을 위해 ES5 문법만 사용
// 동쪽(시간이 빠른 곳)부터. flag 는 flag-icons 국가 코드
var FLAG_URL = 'https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/';
var CITIES = [
  { id:'korea',     name:'한국',       sub:'대구 세천', flag:'kr', emoji:'🇰🇷', tz:'Asia/Seoul',       lat:35.8706, lon:128.4708, highlight:true },
  { id:'shanghai',  name:'상해',       sub:'중국',     flag:'cn', emoji:'🇨🇳', tz:'Asia/Shanghai',    lat:31.2304, lon:121.4737 },
  { id:'taiyuan',   name:'타이위안',    sub:'중국',     flag:'cn', emoji:'🇨🇳', tz:'Asia/Shanghai',    lat:37.8706, lon:112.5489 },
  { id:'taiwan',    name:'대만',       sub:'타이베이',  flag:'tw', emoji:'🇹🇼', tz:'Asia/Taipei',      lat:25.0330, lon:121.5654 },
  { id:'frankfurt', name:'프랑크푸르트', sub:'독일',     flag:'de', emoji:'🇩🇪', tz:'Europe/Berlin',    lat:50.1109, lon:8.6821 },
  { id:'newyork',   name:'뉴욕',       sub:'미국',     flag:'us', emoji:'🇺🇸', tz:'America/New_York', lat:40.7128, lon:-74.0060 },
  { id:'dallas',    name:'댈러스',     sub:'미국',     flag:'us', emoji:'🇺🇸', tz:'America/Chicago',  lat:32.7767, lon:-96.7970 }
];

var I = {
  sun:   '<svg viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>',
  moon:  '<svg viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>',
  cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>',
  rain:  '<svg viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6M8 14v6M12 16v6"/></svg>',
  snow:  '<svg viewBox="0 0 24 24" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="m20 16-4-4 4-4M4 8l4 4-4 4M20 8l-4 4 4 4M4 16l4-4-4-4"/></svg>',
  storm: '<svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.326A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.973"/><path d="m13 12-3 5h4l-3 5"/></svg>',
  fog:   '<svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h3m4 0h9M3 10h11m4 0h1M1 15h11m4 0h3M3 20h7m4 0h9"/></svg>',
  na:    '<svg viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 5.12 2.12c0 2-3 3-3 3M12 17h.01"/></svg>'
};

function getIcon(wmo, isDay) {
  if (wmo == null) return I.na;
  if (wmo === 0)   return isDay ? I.sun : I.moon;
  if (wmo <= 3)    return I.cloud;
  if (wmo <= 48)   return I.fog;
  if (wmo <= 67)   return I.rain;
  if (wmo <= 77)   return I.snow;
  if (wmo <= 82)   return I.rain;
  if (wmo <= 86)   return I.snow;
  if (wmo <= 99)   return I.storm;
  return I.na;
}

// 간단한 JSON GET (fetch 미지원 환경 대비 XHR 사용)
function getJSON(url, cb) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', url + (url.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now(), true);
    x.timeout = 15000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        try { cb(null, JSON.parse(x.responseText)); } catch (e) { cb(e); }
      } else {
        cb(new Error('HTTP ' + x.status));
      }
    };
    x.onerror = function () { cb(new Error('network')); };
    x.ontimeout = function () { cb(new Error('timeout')); };
    x.send();
  } catch (e) { cb(e); }
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }

// Intl timeZone 미지원 환경을 위한 폴백 (분 단위). 미국·유럽은 서머타임을 직접 계산한다.
// 해당 월의 n번째(n=-1 이면 마지막) 일요일 0시(UTC 기준 날짜)의 ms
function sundayUTC(y, mo, n) {
  if (n > 0) {
    var first = new Date(Date.UTC(y, mo, 1)).getUTCDay();
    return Date.UTC(y, mo, 1 + (7 - first) % 7 + 7 * (n - 1));
  }
  var last = new Date(Date.UTC(y, mo + 1, 0));
  return Date.UTC(y, mo, last.getUTCDate() - last.getUTCDay());
}
function tzOffset(tz, now) {
  var t = now.getTime(), y = now.getUTCFullYear(), H = 3600000;
  if (tz === 'Asia/Seoul') return 540;
  if (tz === 'Asia/Shanghai' || tz === 'Asia/Taipei') return 480;
  if (tz === 'Europe/Berlin') {
    // 3월 마지막 일요일 01:00 UTC ~ 10월 마지막 일요일 01:00 UTC
    return (t >= sundayUTC(y, 2, -1) + H && t < sundayUTC(y, 9, -1) + H) ? 120 : 60;
  }
  var std = tz === 'America/New_York' ? -300 : (tz === 'America/Chicago' ? -360 : 0);
  if (!std) return 0;
  // 3월 둘째 일요일 02:00 ~ 11월 첫째 일요일 02:00 (현지 시각)
  var on = sundayUTC(y, 2, 2) + 2 * H - std * 60000;
  var off = sundayUTC(y, 10, 1) + 2 * H - (std + 60) * 60000;
  return (t >= on && t < off) ? std + 60 : std;
}
var tzSupported = (function () {
  try { new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }); return true; } catch (e) { return false; }
})();

// 해당 타임존의 { h, m, s, day(0~6), y, mo, d } 반환
function zoned(now, tz) {
  if (tzSupported) {
    var str = now.toLocaleString('en-US', {
      timeZone: tz, hour12: false, year: 'numeric', month: 'numeric', day: 'numeric',
      hour: 'numeric', minute: 'numeric', second: 'numeric'
    });
    // "9/9/2026, 15:49:21" 형태
    var m = str.match(/(\d+)\/(\d+)\/(\d+),?\s+(\d+):(\d+):(\d+)/);
    if (m) {
      var h = parseInt(m[4], 10); if (h === 24) h = 0;
      var dt = new Date(parseInt(m[3], 10), parseInt(m[1], 10) - 1, parseInt(m[2], 10));
      return { y: +m[3], mo: +m[1], d: +m[2], h: h, m: +m[5], s: +m[6], day: dt.getDay() };
    }
  }
  var off = tzOffset(tz, now);
  var t = new Date(now.getTime() + (now.getTimezoneOffset() + off) * 60000);
  return { y: t.getFullYear(), mo: t.getMonth() + 1, d: t.getDate(), h: t.getHours(), m: t.getMinutes(), s: t.getSeconds(), day: t.getDay() };
}

var WD = ['일','월','화','수','목','금','토'];
var wx = {};
for (var ci = 0; ci < CITIES.length; ci++) wx[CITIES[ci].id] = { temp: null, wmo: null, isDay: 1 };

function renderCities() {
  var now = new Date();
  var ko = zoned(now, 'Asia/Seoul');
  var html = '';
  for (var i = 0; i < CITIES.length; i++) {
    var city = CITIES[i];
    var w = wx[city.id];
    var z = zoned(now, city.tz);
    // 한국과 날짜가 다르면 날짜를 주황색으로
    var diff = z.d !== ko.d;
    html +=
      '<div class="panel city' + (city.highlight ? ' hl' : '') + '">' +
        '<div class="c-name">' +
          '<div class="flag"><img src="' + FLAG_URL + city.flag + '.svg" alt="" onerror="this.parentNode.innerHTML=\'' + city.emoji + '\'"/></div>' +
          '<div class="c-label"><div class="c-city">' + city.name + '</div><div class="c-country">' + city.sub + '</div></div>' +
        '</div>' +
        '<div class="c-wx">' + getIcon(w.wmo, w.isDay) + '</div>' +
        '<div class="c-temp' + (w.temp == null ? ' na' : '') + '">' + (w.temp != null ? Math.round(w.temp) : '--') + '<span class="u">°C</span></div>' +
        '<div class="c-time"><div class="c-hm">' + pad2(z.h) + ':' + pad2(z.m) + '</div>' +
          '<div class="c-day' + (diff ? ' diff' : '') + '">' + z.mo + '/' + z.d + ' (' + WD[z.day] + ')</div></div>' +
      '</div>';
  }
  document.getElementById('cityRows').innerHTML = html;
}

function seoulHMS() {
  var z = zoned(new Date(), 'Asia/Seoul');
  return pad2(z.h) + ':' + pad2(z.m) + ':' + pad2(z.s);
}
function updateClock() {
  var z = zoned(new Date(), 'Asia/Seoul');
  document.getElementById('koDate').textContent = z.y + '년 ' + z.mo + '월 ' + z.d + '일 (' + WD[z.day] + ')';
  document.getElementById('koTime').textContent = pad2(z.h) + ':' + pad2(z.m) + ':' + pad2(z.s);
}

function formatNum(n) {
  return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

var prevRate = null;
function applyRate(rate) {
  document.getElementById('rateVal').textContent = formatNum(rate);
  var el = document.getElementById('rateChg');
  // 직전 조회(3분 전) 대비 변동
  if (prevRate !== null && Math.abs(rate - prevRate) >= 0.3) {
    var diff = rate - prevRate, up = diff > 0;
    el.innerHTML = '<span class="pill ' + (up ? 'up' : 'down') + '">' + (up ? '▲ ' : '▼ ') + Math.abs(diff).toFixed(2) + '원</span>';
  } else if (prevRate !== null) {
    el.innerHTML = '<span class="pill flat">변동 없음</span>';
  } else {
    el.innerHTML = '';
  }
  prevRate = rate;
  document.getElementById('rateTime').textContent = '갱신 ' + seoulHMS();
}
function fetchRate() {
  getJSON('https://api.exchangerate-api.com/v4/latest/USD', function (err, d) {
    var rate = (!err && d && d.rates) ? d.rates.KRW : null;
    if (rate) return applyRate(rate);
    // 백업: frankfurter (구 .app 도메인은 리다이렉트되어 실패하므로 .dev/v1 사용)
    getJSON('https://api.frankfurter.dev/v1/latest?base=USD&symbols=KRW', function (err2, d2) {
      var r2 = (!err2 && d2 && d2.rates) ? d2.rates.KRW : null;
      if (r2) applyRate(r2);
    });
  });
}

function fetchWeather() {
  var pending = CITIES.length;
  function done() { if (--pending === 0) renderCities(); }
  for (var i = 0; i < CITIES.length; i++) {
    (function (city) {
      var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + city.lat + '&longitude=' + city.lon + '&current=temperature_2m,weathercode,is_day&timezone=auto';
      getJSON(url, function (err, d) {
        if (!err && d && d.current) {
          wx[city.id] = { temp: d.current.temperature_2m, wmo: d.current.weathercode, isDay: d.current.is_day };
        }
        done();
      });
    })(CITIES[i]);
  }
}

updateClock();
renderCities();
setInterval(function () { updateClock(); renderCities(); }, 1000);
fetchRate();
fetchWeather();
setInterval(fetchRate, 3 * 60 * 1000);
setInterval(fetchWeather, 10 * 60 * 1000);

// 1080x1920 디자인을 뷰포트의 가로/세로에 각각 꽉 맞춘다(비율 무시, 여백 없음).
// xtrmCAST 플레이어(가로형 설정)는 웹페이지를 세로 패널과 다른 비율의 영역에
// 그리므로, 여백 없이 채우는 것을 우선한다. 일반 브라우저에서는 찌그러져 보일 수 있다.
// 플레이어가 쿼리스트링을 떼어낼 수 있으므로 #debug=1 형태도 허용한다.
var URL_FLAGS = window.location.search + window.location.hash;
// ?debug=1 : 플레이어 브라우저가 보고하는 뷰포트 값과 뷰포트 경계를 화면에 표시
var DEBUG_MODE = /[?&#]debug=1/.test(URL_FLAGS);

function fitScreen() {
  // CSS 퍼센트가 기준으로 삼는 레이아웃 뷰포트를 우선 사용한다.
  // (window.innerWidth 는 스크롤바/줌/에뮬레이션에서 어긋날 수 있음)
  var d = document.documentElement;
  var w = d.clientWidth || window.innerWidth;
  var h = d.clientHeight || window.innerHeight;
  if (!w || !h) return; // 뷰포트가 0인 상태(숨김/프리로드)에서는 건너뜀
  var sx = w / 1080;
  var sy = h / 1920;
  var el = document.querySelector('.screen');
  var t = 'scale(' + sx + ', ' + sy + ')'; // transform-origin 0 0 기준
  el.style.webkitTransform = t;
  el.style.transform = t;
  if (DEBUG_MODE) renderDebug();
}

function renderDebug() {
  var box = document.getElementById('dbg');
  if (!box) {
    // 자홍색 테두리 = 페이지가 받은 뷰포트의 실제 경계
    var frame = document.createElement('div');
    frame.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;' +
      'border:8px solid #ff00ff;z-index:9998;pointer-events:none;';
    document.body.appendChild(frame);
    box = document.createElement('div');
    box.id = 'dbg';
    box.style.cssText = 'position:fixed;left:16px;top:16px;right:16px;z-index:9999;' +
      'background:rgba(0,0,0,.85);color:#00ff66;font-family:monospace;' +
      'white-space:pre-wrap;word-break:break-all;padding:12px;line-height:1.35;';
    document.body.appendChild(box);
  }
  var d = document.documentElement;
  var el = document.querySelector('.screen');
  var r = el.getBoundingClientRect();
  var ds = d.style;
  box.style.fontSize = Math.max(12, Math.round(Math.min(d.clientWidth, d.clientHeight) / 26)) + 'px';
  box.textContent = [
    'inner   ' + window.innerWidth + ' x ' + window.innerHeight,
    'client  ' + d.clientWidth + ' x ' + d.clientHeight,
    'screen  ' + screen.width + ' x ' + screen.height,
    'dpr     ' + (window.devicePixelRatio || 1),
    'flags   ' + (URL_FLAGS || '(없음)'),
    'tf-css  ' + (('transform' in ds) || ('webkitTransform' in ds)),
    'content ' + Math.round(r.left) + ',' + Math.round(r.top) + '  ' +
      Math.round(r.right - r.left) + ' x ' + Math.round(r.bottom - r.top),
    'ua      ' + navigator.userAgent
  ].join('\n');
}
window.addEventListener('resize', fitScreen);
window.addEventListener('orientationchange', fitScreen);
window.addEventListener('load', fitScreen);
document.addEventListener('visibilitychange', fitScreen);
setInterval(fitScreen, 1000); // 일부 DID 플레이어는 resize 이벤트를 안 보냄
fitScreen();
</script>
</body>
</html>
