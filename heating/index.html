<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>S-TECH 냉난방 가동 안내</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
  <link href="../assets/did.css" rel="stylesheet"/>
  <style>
    .glow { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; }
    .screen > *:not(.glow) { position: relative; }

    /* ════════════════════════════
       현재 온도 + 단계
    ════════════════════════════ */
    .hero { flex-shrink: 0; display: flex; align-items: stretch; padding: 44px 0 40px; }
    .h-temp { flex: 1; min-width: 0; padding: 0 36px 0 48px; }
    .h-label { font-size: 1.6rem; font-weight: 600; color: #a3abb9; white-space: nowrap; }
    .h-value {
      font-size: 12rem; font-weight: 800; letter-spacing: -.05em; line-height: 1;
      color: #ffffff; font-variant-numeric: tabular-nums; margin-top: 14px; white-space: nowrap; overflow: hidden;
    }
    .h-value .u { font-size: .32em; font-weight: 600; color: #6b7384; letter-spacing: 0; margin-left: 10px; vertical-align: 1em; }
    .h-value.na { color: #2b3240; }
    .h-sub { font-size: 1.45rem; color: #6b7384; margin-top: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .h-sub b { color: #a3abb9; font-weight: 700; }
    .h-stage {
      width: 420px; flex-shrink: 0; padding: 0 40px;
      border-left: 1px solid rgba(255,255,255,.08);
      display: flex; flex-direction: column; justify-content: center;
    }
    .s-icon { width: 104px; height: 104px; }
    .s-icon svg { width: 100%; height: 100%; }
    .s-name { font-size: 4rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; margin-top: 16px; color: #6b7384; white-space: nowrap; overflow: hidden; }
    .s-reason { margin-top: 14px; font-size: 1.45rem; line-height: 1.45; color: #a3abb9; font-variant-numeric: tabular-nums; }

    /* 한 줄 안내 */
    .msg { flex-shrink: 0; margin-top: 24px; padding: 34px 44px; display: flex; align-items: center; border-radius: 24px; background: rgba(255,255,255,.04); }
    .msg-bar { width: 8px; align-self: stretch; border-radius: 4px; margin-right: 30px; background: #6b7384; }
    .msg-txt { flex: 1; min-width: 0; font-size: 2.6rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.3; color: #f3f5f8; }
    .msg-stage { display: block; font-size: .55em; font-weight: 700; letter-spacing: 0; margin-bottom: 6px; }

    /* ════════════════════════════
       단계 사다리
    ════════════════════════════ */
    .ladder { flex-shrink: 0; display: flex; margin-top: 24px; }
    .step {
      flex: 1; min-width: 0; text-align: center; padding: 20px 4px 18px;
      border-radius: 18px; background: rgba(255,255,255,.035); border: 2px solid transparent;
    }
    .step + .step { margin-left: 10px; }
    .st-name { font-size: 1.4rem; font-weight: 800; color: #6b7384; white-space: nowrap; }
    .st-crit { font-size: 1.1rem; color: #454d5c; margin-top: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .step.cur .st-name { color: #ffffff; }
    .step.cur .st-crit { color: #e3e7ee; }

    /* ════════════════════════════
       기본수칙 3가지
    ════════════════════════════ */
    .tips-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 36px; }
    .tips { flex: 1; min-height: 0; display: flex; }
    .tip { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px 16px; }
    .tip + .tip { margin-left: 16px; }
    .t-icon { width: 180px; height: 180px; }
    .t-icon svg { width: 100%; height: 100%; }
    .t-title { font-size: 3.4rem; font-weight: 800; letter-spacing: -.03em; color: #f3f5f8; margin-top: 34px; white-space: nowrap; }
    .t-sub { font-size: 1.85rem; color: #a3abb9; margin-top: 14px; line-height: 1.4; }
  </style>
</head>
<body>
<div class="screen" id="screen">
  <div class="glow" id="glow"></div>

  <div class="topbar"></div>
  <div class="hdr">
    <div class="brand">
      <img class="logo" src="../assets/logo.gif" alt="S-TECH"/>
      <div class="brand-txt">
        <div class="eyebrow" id="eyebrow">SITE WEATHER</div>
        <div class="title" id="title">현장 온도 안내</div>
      </div>
    </div>
    <div class="clock">
      <div class="clock-time" id="koTime">--:--:--</div>
      <div class="clock-date" id="koDate">—</div>
    </div>
  </div>

  <div class="main">
    <div class="panel hero" id="hero">
      <div class="h-temp">
        <div class="h-label" id="hLabel">현재 기온</div>
        <div class="h-value na" id="hValue">--<span class="u">℃</span></div>
        <div class="h-sub" id="hSub">&nbsp;</div>
      </div>
      <div class="h-stage">
        <div class="s-icon" id="sIcon"></div>
        <div class="s-name" id="sName">확인 중</div>
        <div class="s-reason" id="sCrit">&nbsp;</div>
      </div>
    </div>

    <div class="msg" id="msg"><div class="msg-bar" id="msgBar"></div><div class="msg-txt" id="msgTxt">&nbsp;</div></div>

    <div class="ladder" id="ladder"></div>

    <div class="tips-wrap">
      <div class="sec-head">
        <div class="sec-title"><span class="sec-bar"></span><span class="sec-name" id="tipsTitle">기본수칙</span></div>
        <div class="sec-meta">고용노동부</div>
      </div>
      <div class="tips" id="tips"></div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left" id="upBox"><div class="footer-dot"></div><span id="upTxt">불러오는 중</span></div>
    <div id="srcTxt">기상: Open-Meteo · 기준: 에너지이용 합리화법 · 고용노동부</div>
  </div>
</div>

<script>
// 구형 DID 플레이어(옛 Android WebView / Tizen 등) 호환을 위해 ES5 문법만 사용

// ── 설정 ──
var LOCATION = { name: '대구 달성군 세천', lat: 35.8706, lon: 128.4708 };
// 이 달에는 여름(폭염·냉방) 안내, 나머지 달은 겨울(한파·난방) 안내
// 기상청 여름철 체감온도(5~9월)와 고용노동부 폭염 대책기간(5.15~9.30)에 맞춘다
var SUMMER_MONTHS = [5, 6, 7, 8, 9];
// 위치를 서울에서 대구 세천으로 옮기며 키를 바꿨다(예전 서울 값이 대구로 표시되지 않게)
var CACHE_KEY = 'stech-site-weather';
var STALE_MS = 60 * 60 * 1000;          // 1시간 넘게 갱신이 없으면 하단 표시를 주황색으로

// 기온과 습도(여름철 체감온도 계산용)만 받는다
var DATA_URL = 'https://api.open-meteo.com/v1/forecast?latitude=' + LOCATION.lat + '&longitude=' + LOCATION.lon +
  '&current=temperature_2m,relative_humidity_2m&timezone=Asia%2FSeoul';

// ── 아이콘 (선 아이콘, 색은 그릴 때 넣는다) ──
var P = {
  snow:  '<path d="M12 2v20M2 12h20M20 16l-4-4 4-4M4 8l4 4-4 4M16 4l-4 4-4-4M8 20l4-4 4 4"/>',
  sun:   '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  ok:    '<circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 5-5.5"/>',
  shirt: '<path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>',
  cup:   '<path d="M10 2v2M14 2v2M6 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/>',
  house: '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  drop:  '<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
  shade: '<path d="M22 12a10.06 10.06 1 0 0-20 0Z"/><path d="M12 12v8a2 2 0 0 0 4 0"/><path d="M12 2v1"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  ac:    '<path d="M6 12H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 8h12"/><path d="M18.3 17.7a2.5 2.5 0 0 1-3.16 3.83 2.53 2.53 0 0 1-1.14-2V12"/><path d="M6.6 15.6A2 2 0 1 0 10 17v-5"/>',
  leaf:  '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>'
};
function icon(name, color, w) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="' + (w || 1.6) +
    '" stroke-linecap="round" stroke-linejoin="round">' + P[name] + '</svg>';
}

// ── 겨울: 기온 기준 ──
// 고용노동부·한국산업안전보건공단 「겨울철 한파로 인한 한랭질환 예방가이드 이행매뉴얼」(2018)
// 예방단계별 기온 기준. 안내 문구는 각 단계 조치사항을 현장용으로 짧게 줄인 것.
// 기본수칙은 고용노동부 「한랭질환 예방가이드」(2024) 따뜻한 옷·물·쉼터.
var WINTER = {
  eyebrow: 'HEATING GUIDE', title: '난방 가동 안내', label: '현재 기온', icon: 'snow',
  // 난방 권고 (기온 기준, 추운 쪽부터 확인)
  //  - 20℃: 에너지이용 합리화법 시행규칙 제31조의2 냉난방온도 제한기준 '난방 20℃ 이하'
  //         (실내 설정온도 상한이다. 외부 기온이 이 값 이하일 때 난방을 켜도록 안내한다)
  //  - 0℃: 한랭질환 예방가이드 이행매뉴얼 일상적 관리 단계 '히터 등 난방장치 설치'
  hvac: [
    { at: 0,  name: '난방 가동 권장', icon: 'flame', color: '#fb8c3c', reason: '기온 0℃ 이하<br/>쉼터·작업장 난방을 켜 주세요' },
    { at: 20, name: '난방 가동 가능', icon: 'flame', color: '#f5b041', reason: '기온 20℃ 이하<br/>실내 20℃ 이하로 맞춰 주세요' },
    {         name: '난방 자제 권장', icon: 'leaf',  color: '#34d399', reason: '기온 20℃ 초과<br/>에너지 절약에 협조해 주세요' }
  ],
  // min/max 없이 '이하'로 판정: 추운 단계부터 확인
  stages: [
    { name: '평상시',         short: '평상시',     crit: '0℃ 초과',      color: '#34d399', icon: 'ok',
      msg: '따뜻하게 입고 건강한 하루 보내세요' },
    { name: '일상적 관리 단계', short: '일상적 관리', crit: '0℃ 이하',  max: 0,   color: '#6ea8ff',
      msg: '영하권이에요. 쉼터 난방을 켜 두세요' },
    { name: '한파 관심 단계',   short: '한파 관심',  crit: '영하 6℃ 이하',  max: -6,  color: '#f5b041',
      msg: '추운 시간대엔 따뜻한 쉼터에서 쉬어 가세요' },
    { name: '한파 주의보 단계', short: '한파 주의보', crit: '영하 12℃ 이하', max: -12, color: '#fb8c3c',
      msg: '평소보다 더 자주, 더 길게 쉬어 가세요' },
    { name: '한파 경보 단계',   short: '한파 경보',  crit: '영하 15℃ 이하', max: -15, color: '#f2525b',
      msg: '옥외작업은 줄이고, 몸에 이상이 느껴지면 바로 쉬세요' }
  ],
  tipsTitle: '한랭질환 예방 기본수칙', tipColor: '#6ea8ff',
  tips: [
    { icon: 'shirt', title: '따뜻한 옷', sub: '여러 겹 · 모자 · 장갑' },
    { icon: 'cup',   title: '따뜻한 물', sub: '자주, 충분히' },
    { icon: 'house', title: '따뜻한 쉼터', sub: '추울 땐 쉬어 가기' }
  ]
};

// ── 여름: 체감온도 기준 ──
// 산업안전보건기준에 관한 규칙(2025.7.17 시행): 체감온도 31℃ 이상 냉방·통풍장치 가동 등,
// 33℃ 이상 2시간마다 20분 이상 휴식. 고용노동부 2026 폭염 대책(2026.5.13): 33℃ 작업시간대 조정,
// 35℃ 오후 2~5시 옥외작업 중지, 38℃ 긴급조치 외 옥외작업 중지. 기본수칙 물·그늘·휴식.
var SUMMER = {
  eyebrow: 'COOLING GUIDE', title: '냉방 가동 안내', label: '현재 기온', icon: 'sun',
  // 냉방 권고 (더운 쪽부터 확인)
  //  - 체감 31℃: 산업안전보건기준에 관한 규칙 '체감온도 31℃ 이상 냉방·통풍장치 설치·가동 등'
  //  - 기온 26℃: 에너지이용 합리화법 시행규칙 제31조의2 냉난방온도 제한기준 '냉방 26℃ 이상'
  //              (실내 설정온도 하한이다. 외부 기온이 이 값 이상일 때 에어컨을 켜도록 안내한다)
  hvac: [
    { feels: 31, name: '에어컨 가동 권장', icon: 'ac',   color: '#3b9bff', reason: '체감온도 31℃ 이상<br/>냉방·통풍장치를 켜 주세요' },
    { at: 26,    name: '에어컨 가동 가능', icon: 'ac',   color: '#5cc8ff', reason: '기온 26℃ 이상<br/>실내 26℃ 이상으로 맞춰 주세요' },
    {            name: '에어컨 자제 권장', icon: 'leaf', color: '#34d399', reason: '기온 26℃ 미만<br/>에너지 절약에 협조해 주세요' }
  ],
  stages: [
    { name: '평상시',          short: '평상시',     crit: '체감 31℃ 미만', color: '#34d399', icon: 'ok',
      msg: '물 자주 마시며 건강한 하루 보내세요' },
    { name: '폭염 작업',        short: '폭염 작업',  crit: '체감 31℃ 이상', min: 31, color: '#f5d24b',
      msg: '냉방·통풍장치를 가동해 주세요' },
    { name: '폭염주의보 수준',  short: '주의보 수준', crit: '체감 33℃ 이상', min: 33, color: '#f5b041',
      msg: '2시간마다 20분 이상 시원한 곳에서 쉬세요' },
    { name: '폭염경보 수준',    short: '경보 수준',  crit: '체감 35℃ 이상', min: 35, color: '#fb8c3c',
      msg: '오후 2~5시에는 옥외작업을 멈춰 주세요' },
    { name: '폭염중대경보 수준', short: '중대경보 수준', crit: '체감 38℃ 이상', min: 38, color: '#f2525b',
      msg: '긴급한 작업 외 옥외작업을 멈춰 주세요' }
  ],
  tipsTitle: '온열질환 예방 기본수칙', tipColor: '#5cc8ff',
  tips: [
    { icon: 'drop',  title: '물',   sub: '목마르지 않아도 자주' },
    { icon: 'shade', title: '그늘', sub: '시원한 곳에서 쉬기' },
    { icon: 'clock', title: '휴식', sub: '더울수록 자주, 길게' }
  ]
};

// 화면에 보이는 소수 첫째 자리 값으로 판정해야 표시값과 단계가 어긋나지 않는다
function r1(n) { return Math.round(n * 10) / 10; }
function stageOf(mode, v) {
  var s = mode.stages, i;
  v = r1(v);
  if (mode === WINTER) { for (i = s.length - 1; i > 0; i--) if (v <= s[i].max) return s[i]; }
  else                 { for (i = s.length - 1; i > 0; i--) if (v >= s[i].min) return s[i]; }
  return s[0];
}

// 냉난방 권고: 겨울은 기준 이하에서, 여름은 기준 이상에서 가동
// ta: 기온, fl: 여름철 체감온도. 화면에 보이는 소수 첫째 자리 값으로 판정한다.
function hvacOf(mode, ta, fl) {
  var h = mode.hvac, t = r1(ta), f = fl == null ? null : r1(fl);
  for (var i = 0; i < h.length - 1; i++) {
    var c = h[i];
    if (mode === WINTER ? t <= c.at
        : (c.feels != null ? (f != null && f >= c.feels) : t >= c.at)) return c;
  }
  return h[h.length - 1];
}

// 기상청 여름철 체감온도 (2022.6.2. 변경 산출식). Tw: Stull(2011) 습구온도 추정식
function feelsLikeSummer(ta, rh) {
  var tw = ta * Math.atan(0.151977 * Math.sqrt(rh + 8.313659)) + Math.atan(ta + rh) - Math.atan(rh - 1.67633) +
           0.00391838 * Math.pow(rh, 1.5) * Math.atan(0.023101 * rh) - 4.686035;
  return -0.2442 + 0.55399 * tw + 0.45535 * ta - 0.0022 * tw * tw + 0.00278 * tw * ta + 3.0;
}

// 간단한 JSON GET (fetch 미지원 환경 대비 XHR 사용)
function getJSON(url, cb) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', url + (url.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now(), true);
    x.timeout = 15000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        try { cb(null, JSON.parse(x.responseText)); } catch (e) { cb(e); }
      } else {
        cb(new Error('HTTP ' + x.status));
      }
    };
    x.onerror = function () { cb(new Error('network')); };
    x.ontimeout = function () { cb(new Error('timeout')); };
    x.send();
  } catch (e) { cb(e); }
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function $(id) { return document.getElementById(id); }
function fmt1(n) { var v = r1(n); return (v < 0 ? '−' : '') + Math.abs(v).toFixed(1); }

// 한국 시각 { y, mo, d, h, m, s, day }. 한국은 서머타임이 없어 +9시간 폴백으로 충분하다.
var tzSupported = (function () {
  try { new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }); return true; } catch (e) { return false; }
})();
function seoul(t) {
  var now = t ? new Date(t) : new Date();
  if (tzSupported) {
    var str = now.toLocaleString('en-US', {
      timeZone: 'Asia/Seoul', hour12: false, year: 'numeric', month: 'numeric', day: 'numeric',
      hour: 'numeric', minute: 'numeric', second: 'numeric'
    });
    var m = str.match(/(\d+)\/(\d+)\/(\d+),?\s+(\d+):(\d+):(\d+)/);
    if (m) {
      var h = parseInt(m[4], 10); if (h === 24) h = 0;
      var dt = new Date(parseInt(m[3], 10), parseInt(m[1], 10) - 1, parseInt(m[2], 10));
      return { y: +m[3], mo: +m[1], d: +m[2], h: h, m: +m[5], s: +m[6], day: dt.getDay() };
    }
  }
  var k = new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
  return { y: k.getFullYear(), mo: k.getMonth() + 1, d: k.getDate(), h: k.getHours(), m: k.getMinutes(), s: k.getSeconds(), day: k.getDay() };
}

var WD = ['일', '월', '화', '수', '목', '금', '토'];
function updateClock() {
  var z = seoul();
  $('koTime').textContent = pad2(z.h) + ':' + pad2(z.m) + ':' + pad2(z.s);
  $('koDate').textContent = z.y + '년 ' + z.mo + '월 ' + z.d + '일 (' + WD[z.day] + ')';
}
function fmtTime(ms) {
  var z = seoul(ms);
  return pad2(z.mo) + '.' + pad2(z.d) + ' ' + pad2(z.h) + ':' + pad2(z.m);
}
function currentMode() {
  var mo = seoul().mo;
  for (var i = 0; i < SUMMER_MONTHS.length; i++) if (SUMMER_MONTHS[i] === mo) return SUMMER;
  return WINTER;
}

// '#rrggbb' → 'rgba(r,g,b,a)'
function rgba(hex, a) {
  var n = parseInt(hex.substr(1), 16);
  return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}

// 글자가 칸을 넘으면 넘지 않을 때까지 줄인다
function fitText(el, vertical, min) {
  el.style.fontSize = '';
  var size = parseFloat(window.getComputedStyle(el).fontSize);
  while ((vertical ? el.scrollHeight > el.clientHeight : el.scrollWidth > el.clientWidth) && size > min) {
    size -= 2;
    el.style.fontSize = size + 'px';
  }
}

// ── 렌더 ──
var renderedMode = null;
function renderStatic(mode) {
  // 계절이 바뀔 때만 다시 그리는 부분: 제목, 기본수칙 카드
  if (renderedMode === mode) return;
  renderedMode = mode;
  $('eyebrow').textContent = mode.eyebrow;
  $('title').textContent = mode.title;
  $('tipsTitle').textContent = mode.tipsTitle;
  var html = '';
  for (var i = 0; i < mode.tips.length; i++) {
    var t = mode.tips[i];
    html += '<div class="panel tip"><div class="t-icon">' + icon(t.icon, mode.tipColor, 1.4) + '</div>' +
      '<div class="t-title">' + t.title + '</div><div class="t-sub">' + t.sub + '</div></div>';
  }
  $('tips').innerHTML = html;
}

function renderLadder(mode, cur) {
  var html = '';
  for (var i = 0; i < mode.stages.length; i++) {
    var s = mode.stages[i], on = s === cur;
    html += '<div class="step' + (on ? ' cur' : '') + '"' +
      (on ? ' style="background:' + rgba(s.color, .22) + ';border-color:' + s.color + '"' : '') + '>' +
      '<div class="st-name"' + (on ? '' : ' style="color:' + rgba(s.color, .75) + '"') + '>' + s.short + '</div>' +
      '<div class="st-crit">' + s.crit + '</div></div>';
  }
  $('ladder').innerHTML = html;
}

function render(data) {
  var mode = currentMode();
  renderStatic(mode);
  var cur = data && data.current;
  var ta = cur ? cur.temperature_2m : null, rh = cur ? cur.relative_humidity_2m : null;
  // 큰 숫자와 냉난방 권고는 기온. 폭염 단계는 체감온도(습도가 없으면 단계 판정을 하지 않는다)
  var fl = ta != null && rh != null ? feelsLikeSummer(ta, rh) : null;
  var sv = mode === SUMMER ? fl : ta;

  $('hLabel').textContent = LOCATION.name + ' · ' + mode.label;
  if (ta == null || sv == null) {
    $('hValue').className = 'h-value na';
    $('hValue').innerHTML = '--<span class="u">℃</span>';
    $('hSub').innerHTML = '&nbsp;';
    $('sIcon').innerHTML = '';
    $('sName').textContent = '확인 중';
    $('sName').style.color = '';
    $('sCrit').innerHTML = '&nbsp;';
    $('msgTxt').innerHTML = '&nbsp;';
    $('msgBar').style.background = '';
    $('hero').style.borderColor = '';
    $('hero').style.background = '';
    $('glow').style.background = '';
    renderLadder(mode, null);
  } else {
    var s = stageOf(mode, sv);
    $('hValue').className = 'h-value';
    $('hValue').innerHTML = fmt1(ta) + '<span class="u">℃</span>';
    $('hSub').innerHTML = mode === SUMMER
      ? '체감 <b>' + fmt1(fl) + '℃</b> · 습도 <b>' + Math.round(rh) + '%</b>'
      : (rh != null ? '습도 <b>' + Math.round(rh) + '%</b>' : '&nbsp;');
    // 가장 큰 안내는 냉난방 권고, 그 아래 한 줄은 한파·폭염 단계
    var h = hvacOf(mode, ta, fl);
    $('sIcon').innerHTML = icon(h.icon, h.color);
    $('sName').textContent = h.name;
    $('sName').style.color = h.color;
    $('sCrit').innerHTML = h.reason;
    $('msgTxt').innerHTML = '<span class="msg-stage" style="color:' + s.color + '">' + s.name + ' · ' + s.crit + '</span>' + s.msg;
    $('msgBar').style.background = s.color;
    $('hero').style.borderColor = rgba(h.color, .5);
    $('hero').style.background = 'linear-gradient(180deg,' + rgba(h.color, .12) + ',' + rgba(h.color, .03) + ')';
    $('glow').style.background = 'radial-gradient(1100px 800px at 50% 22%,' + rgba(h.color, .10) + ', transparent 70%)';
    renderLadder(mode, s);
  }
  fitText($('hValue'), false, 80);
  fitText($('sName'), false, 30);

  var up = data && data.fetchedAt, stale = !up || Date.now() - up > STALE_MS;
  $('upTxt').textContent = up ? '업데이트 ' + fmtTime(up) : '불러오는 중';
  $('upBox').className = 'footer-left' + (stale ? ' stale' : '');
}

var lastData = null;
function loadData() {
  getJSON(DATA_URL, function (err, d) {
    if (err || !d || !d.current || d.current.temperature_2m == null) return;
    d.fetchedAt = Date.now();
    lastData = d;
    render(d);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) {}
  });
}

// 네트워크가 늦거나 끊겨도 마지막으로 받은 값을 먼저 보여준다
try {
  var cached = localStorage.getItem(CACHE_KEY);
  if (cached) { lastData = JSON.parse(cached); }
} catch (e) {}
render(lastData || {});
// 웹폰트가 늦게 적용되면 숫자 폭이 달라지므로 다시 맞춘다
window.addEventListener('load', function () { render(lastData || {}); });

updateClock();
setInterval(updateClock, 1000);
loadData();
setInterval(loadData, 10 * 60 * 1000);
// 갱신이 멈췄을 때 주황색 표시, 계절 전환을 위해 1분마다 다시 그린다
setInterval(function () { render(lastData || {}); }, 60 * 1000);

// 1080x1920 디자인을 뷰포트의 가로/세로에 각각 꽉 맞춘다(비율 무시, 여백 없음).
// xtrmCAST 플레이어(가로형 설정)는 웹페이지를 세로 패널과 다른 비율의 영역에
// 그리므로, 여백 없이 채우는 것을 우선한다. 일반 브라우저에서는 찌그러져 보일 수 있다.
// 플레이어가 쿼리스트링을 떼어낼 수 있으므로 #debug=1 형태도 허용한다.
var URL_FLAGS = window.location.search + window.location.hash;
// ?debug=1 : 플레이어 브라우저가 보고하는 뷰포트 값과 뷰포트 경계를 화면에 표시
var DEBUG_MODE = /[?&#]debug=1/.test(URL_FLAGS);

function fitScreen() {
  // CSS 퍼센트가 기준으로 삼는 레이아웃 뷰포트를 우선 사용한다.
  // (window.innerWidth 는 스크롤바/줌/에뮬레이션에서 어긋날 수 있음)
  var d = document.documentElement;
  var w = d.clientWidth || window.innerWidth;
  var h = d.clientHeight || window.innerHeight;
  if (!w || !h) return; // 뷰포트가 0인 상태(숨김/프리로드)에서는 건너뜀
  var sx = w / 1080;
  var sy = h / 1920;
  var el = document.querySelector('.screen');
  var t = 'scale(' + sx + ', ' + sy + ')'; // transform-origin 0 0 기준
  el.style.webkitTransform = t;
  el.style.transform = t;
  if (DEBUG_MODE) renderDebug();
}

function renderDebug() {
  var box = document.getElementById('dbg');
  if (!box) {
    // 자홍색 테두리 = 페이지가 받은 뷰포트의 실제 경계
    var frame = document.createElement('div');
    frame.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;' +
      'border:8px solid #ff00ff;z-index:9998;pointer-events:none;';
    document.body.appendChild(frame);
    box = document.createElement('div');
    box.id = 'dbg';
    box.style.cssText = 'position:fixed;left:16px;top:16px;right:16px;z-index:9999;' +
      'background:rgba(0,0,0,.85);color:#00ff66;font-family:monospace;' +
      'white-space:pre-wrap;word-break:break-all;padding:12px;line-height:1.35;';
    document.body.appendChild(box);
  }
  var d = document.documentElement;
  var el = document.querySelector('.screen');
  var r = el.getBoundingClientRect();
  var ds = d.style;
  box.style.fontSize = Math.max(12, Math.round(Math.min(d.clientWidth, d.clientHeight) / 26)) + 'px';
  box.textContent = [
    'inner   ' + window.innerWidth + ' x ' + window.innerHeight,
    'client  ' + d.clientWidth + ' x ' + d.clientHeight,
    'screen  ' + screen.width + ' x ' + screen.height,
    'dpr     ' + (window.devicePixelRatio || 1),
    'flags   ' + (URL_FLAGS || '(없음)'),
    'tf-css  ' + (('transform' in ds) || ('webkitTransform' in ds)),
    'content ' + Math.round(r.left) + ',' + Math.round(r.top) + '  ' +
      Math.round(r.right - r.left) + ' x ' + Math.round(r.bottom - r.top),
    'data    ' + (lastData && lastData.current ? lastData.current.time + ' ' + lastData.current.temperature_2m + '℃' : '(없음)'),
    'ua      ' + navigator.userAgent
  ].join('\n');
}
window.addEventListener('resize', fitScreen);
window.addEventListener('orientationchange', fitScreen);
window.addEventListener('load', fitScreen);
document.addEventListener('visibilitychange', fitScreen);
setInterval(fitScreen, 1000); // 일부 DID 플레이어는 resize 이벤트를 안 보냄
fitScreen();
</script>
</body>
</html>
