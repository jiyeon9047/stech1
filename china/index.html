<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>S-TECH 중국 공휴일 캘린더</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet"/>
  <link href="../assets/did.css" rel="stylesheet"/>
  <style>
    .card {
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.018));
      border: 1px solid rgba(255,255,255,.07);
    }
    .body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 36px 64px 0; }

    /* ════════════════════════════
       다음 공휴일 카드
    ════════════════════════════ */
    .hero { flex-shrink: 0; position: relative; overflow: hidden; padding: 28px 44px 26px 54px; }
    .hero::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: #d9222f; }
    .hero.now::before { background: #f5b041; }
    .hero-row { display: flex; align-items: center; justify-content: space-between; }
    .hero-main { min-width: 0; }
    .hero-badge {
      display: inline-block; margin-bottom: 10px; padding: 5px 16px; border-radius: 999px;
      font-size: 1.2rem; font-weight: 700; letter-spacing: .08em;
      color: #f2525b; background: rgba(217,34,47,.16);
    }
    .hero.now .hero-badge { color: #f5b041; background: rgba(245,176,65,.14); }
    .hero-name { font-size: 3.3rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; color: #f3f5f8; }
    .hero-name .cn, .hero-name .en { font-size: 1.8rem; font-weight: 500; letter-spacing: 0; color: #6b7384; margin-left: 14px; }
    .hero-range { font-size: 1.7rem; font-weight: 700; color: #a3abb9; margin-top: 8px; font-variant-numeric: tabular-nums; }
    .hero-act { font-size: 1.4rem; color: #6b7384; margin-top: 4px; }
    .hero-act b { color: #f3f5f8; font-weight: 700; }
    .hero-side { text-align: right; flex-shrink: 0; margin-left: 24px; }
    .hero-dday { font-size: 7rem; font-weight: 800; letter-spacing: -.04em; line-height: .95; color: #f2525b; font-variant-numeric: tabular-nums; }
    .hero.now .hero-dday { color: #f5b041; }
    .hero-dday-sub { font-size: 1.35rem; color: #6b7384; margin-top: 8px; }
    .hero-empty { font-size: 1.9rem; font-weight: 700; color: #a3abb9; line-height: 1.6; }
    .hero-empty small { display: block; font-size: 1.35rem; font-weight: 400; color: #6b7384; }
    .hero-note {
      margin-top: 16px; padding: 10px 18px; border-radius: 12px;
      background: rgba(245,176,65,.08); border: 1px solid rgba(245,176,65,.28);
      display: flex; align-items: center; font-size: 1.4rem; color: #a3abb9;
    }
    .note-tag {
      flex-shrink: 0; margin-right: 14px; padding: 3px 10px; border-radius: 6px;
      font-size: 1.15rem; font-weight: 700; color: #0b0e14; background: #f5b041;
    }
    .hero-note b { color: #f5c46b; margin-right: 10px; }

    /* ════════════════════════════
       두 달 달력
    ════════════════════════════ */
    .cals { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 20px; }
    .cals > * + * { margin-top: 16px; }
    .cal { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 18px 26px 20px; }
    .cal-top { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .cal-month { font-size: 2.1rem; font-weight: 800; color: #f3f5f8; }
    .cal-month span { font-size: 1.3rem; font-weight: 500; color: #6b7384; margin-left: 10px; }
    .legend { display: flex; align-items: center; }
    .legend > * + * { margin-left: 22px; }
    .lg { display: flex; align-items: center; font-size: 1.2rem; color: #6b7384; }
    .lg i { display: inline-block; width: 20px; height: 20px; border-radius: 6px; margin-right: 8px; }
    .lg .i-off   { background: rgba(217,34,47,.25); border: 2px solid #d9222f; }
    .lg .i-work, .lg .i-obs { background: rgba(245,176,65,.16); border: 2px solid #f5b041; }
    .lg .i-today { border: 3px solid #f3f5f8; }

    .cal-head {
      flex-shrink: 0; display: grid; grid-template-columns: repeat(7, 1fr); grid-column-gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,.07); margin-bottom: 8px;
    }
    .cal-head span { text-align: center; padding: 4px 0 6px; font-size: 1.25rem; font-weight: 700; color: #6b7384; }
    .cal-head span:first-child { color: #ff6b6b; }
    .cal-head span:last-child  { color: #6ea8ff; }
    .cal-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, 1fr); grid-gap: 8px; }
    .day { min-height: 0; overflow: hidden; border-radius: 10px; background: rgba(255,255,255,.035); }
    .day.blank { background: transparent; }
    .day .num { font-weight: 700; font-variant-numeric: tabular-nums; color: #e3e7ee; }
    .day.sun .num { color: #ff6b6b; }
    .day.sat .num { color: #6ea8ff; }
    .day .lbl { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .day.off { background: rgba(217,34,47,.2); box-shadow: inset 0 0 0 2px rgba(217,34,47,.8); }
    .day.off .num, .day.off .lbl { color: #ff8a90; }
    .day.work, .day.obs { background: rgba(245,176,65,.12); box-shadow: inset 0 0 0 2px rgba(245,176,65,.6); }
    .day.work .num, .day.work .lbl, .day.obs .num, .day.obs .lbl { color: #f5c46b; }
    .day.past { opacity: .35; }
    .day.today { opacity: 1; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 3px #f3f5f8; }
    .day.today.off { background: rgba(217,34,47,.2); }
    .day.today.work, .day.today.obs { background: rgba(245,176,65,.12); }

    /* ════════════════════════════
       올해 공휴일 목록
    ════════════════════════════ */
    .year { flex-shrink: 0; margin-top: 16px; padding: 16px 26px 12px; }
    .year-title { font-size: 1.5rem; font-weight: 800; color: #e3e7ee; margin-bottom: 6px; }
    .year-title span { font-size: 1.2rem; font-weight: 500; color: #6b7384; margin-left: 10px; }
    .hl-row { padding: 5px 12px; border-top: 1px solid rgba(255,255,255,.06); }
    .hl-state { font-size: 1.3rem; font-weight: 700; text-align: right; color: #6b7384; font-variant-numeric: tabular-nums; }
    .hl-row.past { opacity: .35; }
    .hl-row.next { background: rgba(217,34,47,.15); border-radius: 10px; border-top-color: transparent; }
    .hl-row.now  { background: rgba(245,176,65,.12); border-radius: 10px; border-top-color: transparent; }
    .hl-row.now .hl-state { color: #f5c46b; }

    /* 중국어 간체 표기 */
    .cn { font-family: 'Noto Sans SC', 'Pretendard', sans-serif; }

    .day { padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; }
    .day .num { font-size: 2rem; }
    .day .lbl { font-size: 1.1rem; margin-left: 6px; }

    .hl-row { display: grid; grid-template-columns: 2.2fr 2.7fr .8fr 2.6fr 1.1fr; align-items: center; }
    .hl-name { font-size: 1.45rem; font-weight: 700; white-space: nowrap; color: #e3e7ee; }
    .hl-name .cn { font-size: 1.15rem; font-weight: 500; color: #6b7384; margin-left: 8px; }
    .hl-range { font-size: 1.3rem; color: #a3abb9; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .hl-len { font-size: 1.3rem; color: #6b7384; text-align: center; }
    .hl-work { font-size: 1.15rem; color: #f5c46b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hl-work.none { color: #454d5c; }
    .hl-row.next .hl-name, .hl-row.next .hl-state { color: #f2525b; }
    .hl-empty { font-size: 1.4rem; color: #6b7384; padding: 10px 4px; }
  </style>
</head>
<body>
<div class="screen">
  <div class="topbar"></div>
  <div class="hdr">
    <div class="brand">
      <img class="logo" src="../assets/logo.gif" alt="S-TECH"/>
      <div class="brand-txt">
        <div class="eyebrow">CHINA HOLIDAYS</div>
        <div class="title">중국 공휴일</div>
      </div>
    </div>
    <div class="clock">
      <div class="clock-label" id="cnDate">중국 현지</div>
      <div class="clock-time" id="cnTime">--:--:--</div>
      <div class="clock-date" id="krTime">한국 --:--</div>
    </div>
  </div>

  <div class="body">
    <!-- ── 다음 연휴 ── -->
    <div class="card hero" id="hero"></div>

    <!-- ── 이번 달 / 다음 달 ── -->
    <div class="cals">
      <div class="card cal">
        <div class="cal-top">
          <div class="cal-month" id="calTitle0">—</div>
          <div class="legend">
            <div class="lg"><i class="i-off"></i>공휴일</div>
            <div class="lg"><i class="i-work"></i>조정 근무일</div>
            <div class="lg"><i class="i-today"></i>오늘</div>
          </div>
        </div>
        <div class="cal-head"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div class="cal-grid" id="calGrid0"></div>
      </div>
      <div class="card cal">
        <div class="cal-top">
          <div class="cal-month" id="calTitle1">—</div>
        </div>
        <div class="cal-head"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div class="cal-grid" id="calGrid1"></div>
      </div>
    </div>

    <!-- ── 올해 공휴일 ── -->
    <div class="card year">
      <div class="year-title" id="listTitle">법정 공휴일</div>
      <div id="hlRows"></div>
    </div>
  </div>

  <!-- ── FOOTER ── -->
  <div class="footer">
    <div class="footer-left"><div class="footer-dot"></div>실시간 업데이트 중</div>
    <div>출처: 중국 국무원</div>
  </div>
</div>

<script>
// 구형 DID 플레이어(옛 Android WebView / Tizen 등) 호환을 위해 ES5 문법만 사용

var HOLIDAY_KO = {
  '元旦': '신정', '春节': '춘절', '清明节': '청명절', '劳动节': '노동절',
  '端午节': '단오절', '中秋节': '중추절', '国庆节': '국경절'
};

// 공휴일 데이터: 국무원 발표를 연도별 JSON으로 정리한 holiday-cn 저장소.
// 새 연도가 발표되면 자동으로 반영된다. {y} 자리에 연도가 들어간다.
var DATA_URLS = [
  'https://cdn.jsdelivr.net/gh/NateScarlet/holiday-cn@master/{y}.json',
  'https://raw.githubusercontent.com/NateScarlet/holiday-cn/master/{y}.json'
];

// 네트워크가 안 될 때를 위한 내장 데이터 [이름, 날짜, 1=휴무 / 0=조정 근무]
// 출처: 国务院办公厅关于2026年部分节假日安排的通知
// https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm
var EMBEDDED = {
  2026: [
    ['元旦','2026-01-01',1],
    ['元旦','2026-01-02',1],
    ['元旦','2026-01-03',1],
    ['元旦','2026-01-04',0],
    ['春节','2026-02-14',0],
    ['春节','2026-02-15',1],
    ['春节','2026-02-16',1],
    ['春节','2026-02-17',1],
    ['春节','2026-02-18',1],
    ['春节','2026-02-19',1],
    ['春节','2026-02-20',1],
    ['春节','2026-02-21',1],
    ['春节','2026-02-22',1],
    ['春节','2026-02-23',1],
    ['春节','2026-02-28',0],
    ['清明节','2026-04-04',1],
    ['清明节','2026-04-05',1],
    ['清明节','2026-04-06',1],
    ['劳动节','2026-05-01',1],
    ['劳动节','2026-05-02',1],
    ['劳动节','2026-05-03',1],
    ['劳动节','2026-05-04',1],
    ['劳动节','2026-05-05',1],
    ['劳动节','2026-05-09',0],
    ['端午节','2026-06-19',1],
    ['端午节','2026-06-20',1],
    ['端午节','2026-06-21',1],
    ['国庆节','2026-09-20',0],
    ['中秋节','2026-09-25',1],
    ['中秋节','2026-09-26',1],
    ['中秋节','2026-09-27',1],
    ['国庆节','2026-10-01',1],
    ['国庆节','2026-10-02',1],
    ['国庆节','2026-10-03',1],
    ['国庆节','2026-10-04',1],
    ['国庆节','2026-10-05',1],
    ['国庆节','2026-10-06',1],
    ['国庆节','2026-10-07',1],
    ['国庆节','2026-10-10',0]
  ]
};

var yearDays = {}; // 연도 -> [{ name, date, isOffDay }]
(function () {
  for (var y in EMBEDDED) {
    var list = [];
    for (var i = 0; i < EMBEDDED[y].length; i++) {
      var r = EMBEDDED[y][i];
      list.push({ name: r[0], date: r[1], isOffDay: r[2] === 1 });
    }
    yearDays[y] = list;
  }
})();

// 간단한 JSON GET (fetch 미지원 환경 대비 XHR 사용)
function getJSON(url, cb) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', url + (url.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now(), true);
    x.timeout = 15000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        try { cb(null, JSON.parse(x.responseText)); } catch (e) { cb(e); }
      } else {
        cb(new Error('HTTP ' + x.status));
      }
    };
    x.onerror = function () { cb(new Error('network')); };
    x.ontimeout = function () { cb(new Error('timeout')); };
    x.send();
  } catch (e) { cb(e); }
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }

var tzSupported = (function () {
  try { new Date().toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }); return true; } catch (e) { return false; }
})();

// 해당 타임존의 { y, mo, d, h, m, s, day(0~6) }. 중국·한국은 서머타임이 없어 고정 오프셋 폴백으로 충분하다.
function zoned(tz, offMin) {
  var now = new Date();
  if (tzSupported) {
    var str = now.toLocaleString('en-US', {
      timeZone: tz, hour12: false, year: 'numeric', month: 'numeric', day: 'numeric',
      hour: 'numeric', minute: 'numeric', second: 'numeric'
    });
    // "9/9/2026, 15:49:21" 형태
    var m = str.match(/(\d+)\/(\d+)\/(\d+),?\s+(\d+):(\d+):(\d+)/);
    if (m) {
      var h = parseInt(m[4], 10); if (h === 24) h = 0;
      var dt = new Date(parseInt(m[3], 10), parseInt(m[1], 10) - 1, parseInt(m[2], 10));
      return { y: +m[3], mo: +m[1], d: +m[2], h: h, m: +m[5], s: +m[6], day: dt.getDay() };
    }
  }
  var t = new Date(now.getTime() + (now.getTimezoneOffset() + offMin) * 60000);
  return { y: t.getFullYear(), mo: t.getMonth() + 1, d: t.getDate(), h: t.getHours(), m: t.getMinutes(), s: t.getSeconds(), day: t.getDay() };
}
function chinaNow() { return zoned('Asia/Shanghai', 480); }
function koreaNow() { return zoned('Asia/Seoul', 540); }

// 날짜는 1970-01-01부터의 일수(dn)로 다룬다. 타임존 영향을 받지 않는다.
function dnOf(y, mo, d) { return Math.floor(Date.UTC(y, mo - 1, d) / 86400000); }
function dnOfKey(k) { return dnOf(+k.substr(0, 4), +k.substr(5, 2), +k.substr(8, 2)); }
function ymd(dn) {
  var t = new Date(dn * 86400000);
  return { y: t.getUTCFullYear(), mo: t.getUTCMonth() + 1, d: t.getUTCDate(), day: t.getUTCDay() };
}

var WD = ['일', '월', '화', '수', '목', '금', '토'];
function fmtMD(dn) { var z = ymd(dn); return z.mo + '월 ' + z.d + '일(' + WD[z.day] + ')'; }
function fmtShort(dn) { var z = ymd(dn); return z.mo + '.' + z.d + '(' + WD[z.day] + ')'; }
function fmtRange(s, e) {
  if (s === e) return fmtMD(s);
  var a = ymd(s), b = ymd(e);
  if (a.y === b.y && a.mo === b.mo) return fmtMD(s) + ' ~ ' + b.d + '일(' + WD[b.day] + ')';
  return fmtMD(s) + ' ~ ' + fmtMD(e);
}

// "国庆节、中秋节" 처럼 합쳐진 이름도 처리한다
function koName(cn) {
  var parts = cn.split('、'), out = [];
  for (var i = 0; i < parts.length; i++) out.push(HOLIDAY_KO[parts[i]] || parts[i]);
  return out.join('·');
}

var dayInfo = {};  // dn -> { name, off }
var periods = [];  // [{ name, ko, start, end, works: [dn] }] 시작일 순
var workDays = []; // [{ dn, name }] 날짜 순

function rebuild() {
  var all = [], y, i;
  for (y in yearDays) {
    for (i = 0; i < yearDays[y].length; i++) {
      var r = yearDays[y][i];
      all.push({ name: r.name, dn: dnOfKey(r.date), off: !!r.isOffDay });
    }
  }
  all.sort(function (a, b) { return a.dn - b.dn; });

  dayInfo = {}; periods = []; workDays = [];
  var cur = null;
  for (i = 0; i < all.length; i++) {
    var it = all[i];
    dayInfo[it.dn] = { name: it.name, off: it.off };
    if (!it.off) { workDays.push({ dn: it.dn, name: it.name }); continue; }
    // 같은 이름으로 이어지는 휴무일을 하나의 연휴로 묶는다
    if (cur && cur.name === it.name && it.dn === cur.end + 1) {
      cur.end = it.dn;
    } else {
      cur = { name: it.name, ko: koName(it.name), start: it.dn, end: it.dn, works: [] };
      periods.push(cur);
    }
  }
  // 조정 근무일은 같은 이름의 가장 가까운 연휴에 붙인다
  for (i = 0; i < workDays.length; i++) {
    var w = workDays[i], best = null, bestDist = 1e9;
    for (var j = 0; j < periods.length; j++) {
      var p = periods[j];
      if (p.name !== w.name) continue;
      var dist = w.dn < p.start ? p.start - w.dn : (w.dn > p.end ? w.dn - p.end : 0);
      if (dist < bestDist) { bestDist = dist; best = p; }
    }
    if (best) best.works.push(w.dn);
  }
}

// 연휴가 끝난 뒤 첫 출근일 (주말이면 조정 근무일이 아닌 한 넘긴다)
function returnDay(p) {
  for (var d = p.end + 1; d < p.end + 15; d++) {
    var info = dayInfo[d];
    if (info && info.off) continue;
    if (info && !info.off) return d;
    var wd = ymd(d).day;
    if (wd === 0 || wd === 6) continue;
    return d;
  }
  return p.end + 1;
}

function renderHero(T) {
  var now = null, next = null, i;
  for (i = 0; i < periods.length; i++) {
    var p = periods[i];
    if (p.start <= T && T <= p.end) now = p;
    else if (p.start > T && !next) next = p;
  }

  var el = document.getElementById('hero');
  var html = '';
  if (now) {
    var len = now.end - now.start + 1, nth = T - now.start + 1;
    el.className = 'card hero now';
    html =
      '<div class="hero-row">' +
        '<div class="hero-main">' +
          '<div class="hero-badge">연휴 중</div>' +
          '<div class="hero-name">' + now.ko + '<span class="cn">' + now.name + '</span></div>' +
          '<div class="hero-range">' + fmtRange(now.start, now.end) + ' · ' + len + '일간 휴무</div>' +
          '<div class="hero-act">업무 복귀 <b>' + fmtMD(returnDay(now)) + '</b></div>' +
        '</div>' +
        '<div class="hero-side">' +
          '<div class="hero-dday">' + nth + '/' + len + '</div>' +
        '</div>' +
      '</div>';
  } else if (next) {
    var dd = next.start - T;
    el.className = 'card hero';
    html =
      '<div class="hero-row">' +
        '<div class="hero-main">' +
          '<div class="hero-badge">다음 중국 연휴</div>' +
          '<div class="hero-name">' + next.ko + '<span class="cn">' + next.name + '</span></div>' +
          '<div class="hero-range">' + fmtRange(next.start, next.end) + ' · ' + (next.end - next.start + 1) + '일간 휴무</div>' +
          '<div class="hero-act">업무 복귀 <b>' + fmtMD(returnDay(next)) + '</b></div>' +
        '</div>' +
        '<div class="hero-side">' +
          '<div class="hero-dday">D-' + dd + '</div>' +
        '</div>' +
      '</div>';
  } else {
    el.className = 'card hero';
    html =
      '<div class="hero-empty">다음 중국 공휴일 일정 발표 전</div>';
  }

  // 다음 조정 근무일: 주말이지만 중국은 출근하는 날이라 따로 알린다
  for (i = 0; i < workDays.length; i++) {
    var w = workDays[i];
    if (w.dn < T) continue;
    var when = w.dn === T ? '오늘' : (w.dn - T === 1 ? '내일' : 'D-' + (w.dn - T));
    html +=
      '<div class="hero-note">' +
        '<span class="note-tag">조정 근무일</span>' +
        '<b>' + fmtMD(w.dn) + ' 출근</b>' +
        koName(w.name) + ' · ' + when +
      '</div>';
    break;
  }
  el.innerHTML = html;
}

// 한 달 달력. 다른 달 날짜는 비워서 두 달이 겹쳐 보이지 않게 한다.
function renderMonth(idx, y, mo, T) {
  var first = dnOf(y, mo, 1);
  var nextFirst = mo === 12 ? dnOf(y + 1, 1, 1) : dnOf(y, mo + 1, 1);
  var lead = ymd(first).day;
  var rows = Math.ceil((lead + (nextFirst - first)) / 7);
  var start = first - lead;

  var html = '', offCount = 0;
  for (var i = 0; i < rows * 7; i++) {
    var dn = start + i;
    if (dn < first || dn >= nextFirst) { html += '<div class="day blank"></div>'; continue; }
    var d = ymd(dn), info = dayInfo[dn];
    var cls = 'day', lbl = '';
    if (d.day === 0) cls += ' sun';
    if (d.day === 6) cls += ' sat';
    if (info && info.off) { cls += ' off'; lbl = koName(info.name); offCount++; }
    else if (info) { cls += ' work'; lbl = '출근'; }
    if (dn < T) cls += ' past';
    if (dn === T) cls += ' today';
    html += '<div class="' + cls + '"><span class="num">' + d.d + '</span><span class="lbl">' + lbl + '</span></div>';
  }
  var grid = document.getElementById('calGrid' + idx);
  grid.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
  grid.innerHTML = html;
  // 해당 연도 데이터가 없으면 '없음'이 아니라 아직 발표 전이다
  var known = yearDays[y] && yearDays[y].length;
  document.getElementById('calTitle' + idx).innerHTML =
    y + '년 ' + mo + '월<span>' +
    (!known ? '일정 발표 전' : (offCount ? '휴무 ' + offCount + '일' : '')) + '</span>';
}

function renderList(T) {
  var year = ymd(T).y, html = '', nextMarked = false, count = 0;
  for (var i = 0; i < periods.length; i++) {
    var p = periods[i];
    if (ymd(p.start).y !== year) continue;
    count++;
    var cls = 'hl-row', state;
    if (p.end < T) { cls += ' past'; state = '종료'; }
    else if (p.start <= T) { cls += ' now'; state = '연휴 중'; }
    else {
      state = 'D-' + (p.start - T);
      if (!nextMarked) { cls += ' next'; nextMarked = true; }
    }
    var works = [];
    for (var j = 0; j < p.works.length; j++) works.push(fmtShort(p.works[j]));
    html +=
      '<div class="' + cls + '">' +
        '<div class="hl-name">' + p.ko + '<span class="cn">' + p.name + '</span></div>' +
        '<div class="hl-range">' + fmtShort(p.start) + (p.end !== p.start ? ' ~ ' + fmtShort(p.end) : '') + '</div>' +
        '<div class="hl-len">' + (p.end - p.start + 1) + '일</div>' +
        '<div class="hl-work' + (works.length ? '' : ' none') + '">' + (works.length ? '출근 ' + works.join(', ') : '-') + '</div>' +
        '<div class="hl-state">' + state + '</div>' +
      '</div>';
  }
  if (!count) html = '<div class="hl-empty">일정 발표 전</div>';
  document.getElementById('hlRows').innerHTML = html;
  document.getElementById('listTitle').textContent = year + '년 중국 법정 공휴일';
}

var lastT = null;
function renderAll(force) {
  var z = chinaNow(), k = koreaNow();
  document.getElementById('cnDate').textContent = '중국 현지 · ' + z.mo + '월 ' + z.d + '일 (' + WD[z.day] + ')';
  document.getElementById('cnTime').textContent = pad2(z.h) + ':' + pad2(z.m) + ':' + pad2(z.s);
  document.getElementById('krTime').innerHTML = '한국 시각 <b>' + pad2(k.h) + ':' + pad2(k.m) + '</b>';
  var T = dnOf(z.y, z.mo, z.d);
  if (!force && T === lastT) return; // 날짜가 바뀔 때만 달력을 다시 그린다
  lastT = T;
  renderHero(T);
  renderMonth(0, z.y, z.mo, T);
  renderMonth(1, z.mo === 12 ? z.y + 1 : z.y, z.mo === 12 ? 1 : z.mo + 1, T);
  renderList(T);
}

// 올해와 내년 데이터를 받는다. 아직 발표 전인 연도는 빈 목록이 오므로 내장 데이터를 유지한다.
function loadYear(y) {
  var idx = 0;
  (function tryNext() {
    if (idx >= DATA_URLS.length) return;
    getJSON(DATA_URLS[idx++].replace('{y}', y), function (err, d) {
      if (err) return tryNext();
      if (d && d.days && d.days.length) {
        yearDays[y] = d.days;
        rebuild();
        renderAll(true);
      }
    });
  })();
}
function refreshData() {
  var y = chinaNow().y;
  loadYear(y);
  loadYear(y + 1);
}

rebuild();
renderAll(true);
setInterval(function () { renderAll(false); }, 1000);
refreshData();
setInterval(refreshData, 6 * 60 * 60 * 1000);

// 1080x1920 디자인을 뷰포트의 가로/세로에 각각 꽉 맞춘다(비율 무시, 여백 없음).
// xtrmCAST 플레이어(가로형 설정)는 웹페이지를 세로 패널과 다른 비율의 영역에
// 그리므로, 여백 없이 채우는 것을 우선한다. 일반 브라우저에서는 찌그러져 보일 수 있다.
// 플레이어가 쿼리스트링을 떼어낼 수 있으므로 #debug=1 형태도 허용한다.
var URL_FLAGS = window.location.search + window.location.hash;
// ?debug=1 : 플레이어 브라우저가 보고하는 뷰포트 값과 뷰포트 경계를 화면에 표시
var DEBUG_MODE = /[?&#]debug=1/.test(URL_FLAGS);

function fitScreen() {
  // CSS 퍼센트가 기준으로 삼는 레이아웃 뷰포트를 우선 사용한다.
  // (window.innerWidth 는 스크롤바/줌/에뮬레이션에서 어긋날 수 있음)
  var d = document.documentElement;
  var w = d.clientWidth || window.innerWidth;
  var h = d.clientHeight || window.innerHeight;
  if (!w || !h) return; // 뷰포트가 0인 상태(숨김/프리로드)에서는 건너뜀
  var sx = w / 1080;
  var sy = h / 1920;
  var el = document.querySelector('.screen');
  var t = 'scale(' + sx + ', ' + sy + ')'; // transform-origin 0 0 기준
  el.style.webkitTransform = t;
  el.style.transform = t;
  if (DEBUG_MODE) renderDebug();
}

function renderDebug() {
  var box = document.getElementById('dbg');
  if (!box) {
    // 자홍색 테두리 = 페이지가 받은 뷰포트의 실제 경계
    var frame = document.createElement('div');
    frame.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;' +
      'border:8px solid #ff00ff;z-index:9998;pointer-events:none;';
    document.body.appendChild(frame);
    box = document.createElement('div');
    box.id = 'dbg';
    box.style.cssText = 'position:fixed;left:16px;top:16px;right:16px;z-index:9999;' +
      'background:rgba(0,0,0,.85);color:#00ff66;font-family:monospace;' +
      'white-space:pre-wrap;word-break:break-all;padding:12px;line-height:1.35;';
    document.body.appendChild(box);
  }
  var d = document.documentElement;
  var el = document.querySelector('.screen');
  var r = el.getBoundingClientRect();
  var ds = d.style;
  box.style.fontSize = Math.max(12, Math.round(Math.min(d.clientWidth, d.clientHeight) / 26)) + 'px';
  box.textContent = [
    'inner   ' + window.innerWidth + ' x ' + window.innerHeight,
    'client  ' + d.clientWidth + ' x ' + d.clientHeight,
    'screen  ' + screen.width + ' x ' + screen.height,
    'dpr     ' + (window.devicePixelRatio || 1),
    'flags   ' + (URL_FLAGS || '(없음)'),
    'tf-css  ' + (('transform' in ds) || ('webkitTransform' in ds)),
    'content ' + Math.round(r.left) + ',' + Math.round(r.top) + '  ' +
      Math.round(r.right - r.left) + ' x ' + Math.round(r.bottom - r.top),
    'ua      ' + navigator.userAgent
  ].join('\n');
}
window.addEventListener('resize', fitScreen);
window.addEventListener('orientationchange', fitScreen);
window.addEventListener('load', fitScreen);
document.addEventListener('visibilitychange', fitScreen);
setInterval(fitScreen, 1000); // 일부 DID 플레이어는 resize 이벤트를 안 보냄
fitScreen();
</script>
