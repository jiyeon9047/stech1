<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>S-TECH 중국 공휴일 캘린더</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+SC:wght@500;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f5f9;
      font-family: 'Noto Sans KR', 'Noto Sans SC', sans-serif;
      color: #0f172a;
    }

    .screen {
      width: 1080px;
      height: 1920px;
      display: flex;
      flex-direction: column;
      background: #f3f5f9;
      overflow: hidden;
      /* fixed: 축소 전 1080x1920 박스가 문서 크기를 키우지 않게 한다.
         문서가 화면보다 크면 WebView가 페이지를 축소해 여백이 생길 수 있다. */
      position: fixed;
      top: 0;
      left: 0;
      -webkit-transform-origin: 0 0;
      transform-origin: 0 0;
    }

    /* 중국어 간체 표기 */
    .cn { font-family: 'Noto Sans SC', 'Noto Sans KR', sans-serif; }

    .card {
      background: #ffffff;
      border: 1px solid #e3e7ee;
      border-radius: 20px;
      box-shadow: 0 2px 10px rgba(15,23,42,.05);
    }

    /* ════════════════════════════
       HEADER
    ════════════════════════════ */
    .top-stripe { flex-shrink: 0; height: 12px; background: #d7261e; }
    .header {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 26px 56px 22px;
      background: #ffffff;
      border-bottom: 1px solid #e3e7ee;
    }
    .brand { display: flex; align-items: center; }
    /* 로고 원본은 어두운 배경용(밝은 회색 글씨)이라 메인 화면과 같은 바탕을 깐다 */
    .logo-wrap { background: #080d14; border-radius: 14px; padding: 12px 20px; }
    .logo-img { height: 50px; width: auto; display: block; mix-blend-mode: screen; filter: brightness(1.1) contrast(1.05); }
    .brand-txt { margin-left: 26px; padding-left: 26px; border-left: 2px solid #e3e7ee; }
    .brand-title { font-size: 2.5rem; font-weight: 900; letter-spacing: -.01em; line-height: 1.15; }
    .brand-title em { font-style: normal; color: #d7261e; }
    .brand-sub { font-size: 1.35rem; color: #64748b; margin-top: 4px; }

    .clock { text-align: right; }
    .clock-label { font-size: 1.25rem; font-weight: 700; color: #d7261e; letter-spacing: .08em; }
    .clock-time {
      font-size: 3.4rem; font-weight: 900; line-height: 1.05;
      font-variant-numeric: tabular-nums; letter-spacing: .02em;
    }
    .clock-kr { font-size: 1.3rem; color: #64748b; font-variant-numeric: tabular-nums; }
    .clock-kr b { color: #0f172a; font-weight: 700; }

    .body {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 22px 56px 0;
    }

    /* ════════════════════════════
       다음 연휴 카드
    ════════════════════════════ */
    .hero {
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      padding: 22px 40px 20px 48px;
    }
    .hero::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 10px;
      background: #d7261e;
    }
    .hero.now::before { background: #d97706; }
    .hero-row { display: flex; align-items: center; justify-content: space-between; }
    .hero-main { min-width: 0; }
    .hero-badge {
      display: inline-block;
      font-size: 1.25rem; font-weight: 700; letter-spacing: .1em;
      color: #b91c1c; background: #fdecec;
      border-radius: 999px; padding: 4px 16px; margin-bottom: 8px;
    }
    .hero.now .hero-badge { color: #92400e; background: #fff4d6; }
    .hero-name { font-size: 3.3rem; font-weight: 900; line-height: 1.1; white-space: nowrap; }
    .hero-name .cn { font-size: 1.9rem; font-weight: 500; color: #94a3b8; margin-left: 14px; }
    .hero-range { font-size: 1.7rem; font-weight: 700; color: #334155; margin-top: 6px; }
    .hero-act { font-size: 1.45rem; color: #64748b; margin-top: 4px; }
    .hero-act b { color: #b91c1c; font-weight: 700; }
    .hero-side { text-align: right; flex-shrink: 0; margin-left: 24px; }
    .hero-dday {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 7.2rem; line-height: .9; color: #d7261e;
    }
    .hero.now .hero-dday { color: #d97706; }
    .hero-dday-sub { font-size: 1.4rem; color: #64748b; margin-top: 6px; }
    .hero-empty { font-size: 1.9rem; font-weight: 700; color: #334155; line-height: 1.6; }
    .hero-empty small { display: block; font-size: 1.35rem; font-weight: 400; color: #64748b; }
    .hero-note {
      margin-top: 14px; padding: 9px 18px;
      background: #fff8e6; border: 1px solid #f5d38a; border-radius: 12px;
      display: flex; align-items: center;
      font-size: 1.4rem; color: #334155;
    }
    .note-tag {
      flex-shrink: 0;
      font-size: 1.2rem; font-weight: 700; color: #ffffff; background: #d97706;
      border-radius: 6px; padding: 3px 10px; margin-right: 14px;
    }
    .hero-note b { color: #92400e; margin-right: 10px; }

    /* ════════════════════════════
       두 달 달력
    ════════════════════════════ */
    .cals {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      margin-top: 18px;
    }
    .cals > * + * { margin-top: 16px; }
    .cal {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      padding: 16px 24px 18px;
    }
    .cal-top {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px;
    }
    .cal-month { font-size: 2.1rem; font-weight: 900; }
    .cal-month span { font-size: 1.35rem; font-weight: 500; color: #94a3b8; margin-left: 10px; }
    .legend { display: flex; align-items: center; }
    .legend > * + * { margin-left: 22px; }
    .lg { display: flex; align-items: center; font-size: 1.2rem; color: #475569; }
    .lg i { display: inline-block; width: 20px; height: 20px; border-radius: 6px; margin-right: 8px; }
    .lg .i-off   { background: #fdecec; border: 2px solid #ef8a8a; }
    .lg .i-work  { background: #fff4d6; border: 2px solid #e8a93a; }
    .lg .i-today { background: #ffffff; border: 3px solid #2563eb; }

    .cal-head {
      flex-shrink: 0;
      display: grid; grid-template-columns: repeat(7, 1fr); grid-column-gap: 8px;
      border-bottom: 1px solid #e3e7ee; margin-bottom: 8px;
    }
    .cal-head span {
      text-align: center; padding: 4px 0 6px;
      font-size: 1.3rem; font-weight: 700; color: #64748b;
    }
    .cal-head span:first-child { color: #dc2626; }
    .cal-head span:last-child  { color: #2563eb; }

    .cal-grid {
      flex: 1; min-height: 0;
      display: grid; grid-template-columns: repeat(7, 1fr); grid-gap: 8px;
    }
    .day {
      min-height: 0; overflow: hidden;
      border-radius: 10px;
      padding: 6px 12px;
      display: flex; align-items: center; justify-content: space-between;
      background: #f7f8fb;
    }
    .day.blank { background: transparent; }
    .day .num { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; color: #1e293b; }
    .day.sun .num { color: #dc2626; }
    .day.sat .num { color: #2563eb; }
    .day .lbl {
      font-size: 1.1rem; font-weight: 700; margin-left: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .day.off  { background: #fdecec; box-shadow: inset 0 0 0 2px #ef8a8a; }
    .day.off .num, .day.off .lbl { color: #b91c1c; }
    .day.work { background: #fff4d6; box-shadow: inset 0 0 0 2px #e8a93a; }
    .day.work .num, .day.work .lbl { color: #92400e; }
    .day.past { opacity: .45; }
    .day.today { box-shadow: inset 0 0 0 3px #2563eb; background: #eef4ff; opacity: 1; }
    .day.today.off  { box-shadow: inset 0 0 0 3px #2563eb; background: #fdecec; }
    .day.today.work { box-shadow: inset 0 0 0 3px #2563eb; background: #fff4d6; }

    /* ════════════════════════════
       올해 공휴일 목록
    ════════════════════════════ */
    .year {
      flex-shrink: 0;
      margin-top: 16px;
      padding: 14px 24px 10px;
    }
    .year-title { font-size: 1.5rem; font-weight: 900; margin-bottom: 4px; }
    .year-title span { font-size: 1.2rem; font-weight: 500; color: #94a3b8; margin-left: 10px; }
    .hl-row {
      display: grid;
      grid-template-columns: 2.2fr 2.7fr .8fr 2.6fr 1.1fr;
      align-items: center;
      padding: 5px 12px;
      border-top: 1px solid #eef1f5;
    }
    .hl-name { font-size: 1.45rem; font-weight: 700; white-space: nowrap; }
    .hl-name .cn { font-size: 1.15rem; font-weight: 500; color: #94a3b8; margin-left: 8px; }
    .hl-range { font-size: 1.3rem; color: #334155; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .hl-len { font-size: 1.3rem; color: #64748b; text-align: center; }
    .hl-work { font-size: 1.15rem; color: #b45309; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hl-work.none { color: #cbd5e1; }
    .hl-state { font-size: 1.3rem; font-weight: 700; text-align: right; color: #64748b; font-variant-numeric: tabular-nums; }
    .hl-row.past { opacity: .4; }
    .hl-row.next { background: #fdecec; border-radius: 10px; border-top-color: transparent; }
    .hl-row.next .hl-name, .hl-row.next .hl-state { color: #b91c1c; }
    .hl-row.now { background: #fff4d6; border-radius: 10px; border-top-color: transparent; }
    .hl-row.now .hl-state { color: #92400e; }
    .hl-empty { font-size: 1.4rem; color: #64748b; padding: 10px 4px; }

    /* ════════════════════════════
       FOOTER
    ════════════════════════════ */
    .footer {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 56px 22px;
      font-size: 1.1rem; color: #94a3b8;
    }
    .footer-left { display: flex; align-items: center; }
    .footer-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; margin-right: 10px; animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
  </style>
</head>

// 구형 DID 플레이어(옛 Android WebView / Tizen 등) 호환을 위해 ES5 문법만 사용

var HOLIDAY_KO = {
  '元旦': '신정', '春节': '춘절', '清明节': '청명절', '劳动节': '노동절',
  '端午节': '단오절', '中秋节': '중추절', '国庆节': '국경절'
};

// 공휴일 데이터: 국무원 발표를 연도별 JSON으로 정리한 holiday-cn 저장소.
// 새 연도가 발표되면 자동으로 반영된다. {y} 자리에 연도가 들어간다.
var DATA_URLS = [
  'https://cdn.jsdelivr.net/gh/NateScarlet/holiday-cn@master/{y}.json',
  'https://raw.githubusercontent.com/NateScarlet/holiday-cn/master/{y}.json'
];

// 네트워크가 안 될 때를 위한 내장 데이터 [이름, 날짜, 1=휴무 / 0=조정 근무]
// 출처: 国务院办公厅关于2026年部分节假日安排的通知
// https://www.gov.cn/zhengce/zhengceku/202511/content_7047091.htm
var EMBEDDED = {
  2026: [
    ['元旦','2026-01-01',1],
    ['元旦','2026-01-02',1],
    ['元旦','2026-01-03',1],
    ['元旦','2026-01-04',0],
    ['春节','2026-02-14',0],
    ['春节','2026-02-15',1],
    ['春节','2026-02-16',1],
    ['春节','2026-02-17',1],
    ['春节','2026-02-18',1],
    ['春节','2026-02-19',1],
    ['春节','2026-02-20',1],
    ['春节','2026-02-21',1],
    ['春节','2026-02-22',1],
    ['春节','2026-02-23',1],
    ['春节','2026-02-28',0],
    ['清明节','2026-04-04',1],
    ['清明节','2026-04-05',1],
    ['清明节','2026-04-06',1],
    ['劳动节','2026-05-01',1],
    ['劳动节','2026-05-02',1],
    ['劳动节','2026-05-03',1],
    ['劳动节','2026-05-04',1],
    ['劳动节','2026-05-05',1],
    ['劳动节','2026-05-09',0],
    ['端午节','2026-06-19',1],
    ['端午节','2026-06-20',1],
    ['端午节','2026-06-21',1],
    ['国庆节','2026-09-20',0],
    ['中秋节','2026-09-25',1],
    ['中秋节','2026-09-26',1],
    ['中秋节','2026-09-27',1],
    ['国庆节','2026-10-01',1],
    ['国庆节','2026-10-02',1],
    ['国庆节','2026-10-03',1],
    ['国庆节','2026-10-04',1],
    ['国庆节','2026-10-05',1],
    ['国庆节','2026-10-06',1],
    ['国庆节','2026-10-07',1],
    ['国庆节','2026-10-10',0]
  ]
};

var yearDays = {}; // 연도 -> [{ name, date, isOffDay }]
(function () {
  for (var y in EMBEDDED) {
    var list = [];
    for (var i = 0; i < EMBEDDED[y].length; i++) {
      var r = EMBEDDED[y][i];
      list.push({ name: r[0], date: r[1], isOffDay: r[2] === 1 });
    }
    yearDays[y] = list;
  }
})();

// 간단한 JSON GET (fetch 미지원 환경 대비 XHR 사용)
function getJSON(url, cb) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', url + (url.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now(), true);
    x.timeout = 15000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        try { cb(null, JSON.parse(x.responseText)); } catch (e) { cb(e); }
      } else {
        cb(new Error('HTTP ' + x.status));
      }
    };
    x.onerror = function () { cb(new Error('network')); };
    x.ontimeout = function () { cb(new Error('timeout')); };
    x.send();
  } catch (e) { cb(e); }
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }

var tzSupported = (function () {
  try { new Date().toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }); return true; } catch (e) { return false; }
})();

// 해당 타임존의 { y, mo, d, h, m, s, day(0~6) }. 중국·한국은 서머타임이 없어 고정 오프셋 폴백으로 충분하다.
function zoned(tz, offMin) {
  var now = new Date();
  if (tzSupported) {
    var str = now.toLocaleString('en-US', {
      timeZone: tz, hour12: false, year: 'numeric', month: 'numeric', day: 'numeric',
      hour: 'numeric', minute: 'numeric', second: 'numeric'
    });
    // "9/9/2026, 15:49:21" 형태
    var m = str.match(/(\d+)\/(\d+)\/(\d+),?\s+(\d+):(\d+):(\d+)/);
    if (m) {
      var h = parseInt(m[4], 10); if (h === 24) h = 0;
      var dt = new Date(parseInt(m[3], 10), parseInt(m[1], 10) - 1, parseInt(m[2], 10));
      return { y: +m[3], mo: +m[1], d: +m[2], h: h, m: +m[5], s: +m[6], day: dt.getDay() };
    }
  }
  var t = new Date(now.getTime() + (now.getTimezoneOffset() + offMin) * 60000);
  return { y: t.getFullYear(), mo: t.getMonth() + 1, d: t.getDate(), h: t.getHours(), m: t.getMinutes(), s: t.getSeconds(), day: t.getDay() };
}
function chinaNow() { return zoned('Asia/Shanghai', 480); }
function koreaNow() { return zoned('Asia/Seoul', 540); }

// 날짜는 1970-01-01부터의 일수(dn)로 다룬다. 타임존 영향을 받지 않는다.
function dnOf(y, mo, d) { return Math.floor(Date.UTC(y, mo - 1, d) / 86400000); }
function dnOfKey(k) { return dnOf(+k.substr(0, 4), +k.substr(5, 2), +k.substr(8, 2)); }
function ymd(dn) {
  var t = new Date(dn * 86400000);
  return { y: t.getUTCFullYear(), mo: t.getUTCMonth() + 1, d: t.getUTCDate(), day: t.getUTCDay() };
}

var WD = ['일', '월', '화', '수', '목', '금', '토'];
function fmtMD(dn) { var z = ymd(dn); return z.mo + '월 ' + z.d + '일(' + WD[z.day] + ')'; }
function fmtShort(dn) { var z = ymd(dn); return z.mo + '.' + z.d + '(' + WD[z.day] + ')'; }
function fmtRange(s, e) {
  if (s === e) return fmtMD(s);
  var a = ymd(s), b = ymd(e);
  if (a.y === b.y && a.mo === b.mo) return fmtMD(s) + ' ~ ' + b.d + '일(' + WD[b.day] + ')';
  return fmtMD(s) + ' ~ ' + fmtMD(e);
}

// "国庆节、中秋节" 처럼 합쳐진 이름도 처리한다
function koName(cn) {
  var parts = cn.split('、'), out = [];
  for (var i = 0; i < parts.length; i++) out.push(HOLIDAY_KO[parts[i]] || parts[i]);
  return out.join('·');
}

var dayInfo = {};  // dn -> { name, off }
var periods = [];  // [{ name, ko, start, end, works: [dn] }] 시작일 순
var workDays = []; // [{ dn, name }] 날짜 순

function rebuild() {
  var all = [], y, i;
  for (y in yearDays) {
    for (i = 0; i < yearDays[y].length; i++) {
      var r = yearDays[y][i];
      all.push({ name: r.name, dn: dnOfKey(r.date), off: !!r.isOffDay });
    }
  }
  all.sort(function (a, b) { return a.dn - b.dn; });

  dayInfo = {}; periods = []; workDays = [];
  var cur = null;
  for (i = 0; i < all.length; i++) {
    var it = all[i];
    dayInfo[it.dn] = { name: it.name, off: it.off };
    if (!it.off) { workDays.push({ dn: it.dn, name: it.name }); continue; }
    // 같은 이름으로 이어지는 휴무일을 하나의 연휴로 묶는다
    if (cur && cur.name === it.name && it.dn === cur.end + 1) {
      cur.end = it.dn;
    } else {
      cur = { name: it.name, ko: koName(it.name), start: it.dn, end: it.dn, works: [] };
      periods.push(cur);
    }
  }
  // 조정 근무일은 같은 이름의 가장 가까운 연휴에 붙인다
  for (i = 0; i < workDays.length; i++) {
    var w = workDays[i], best = null, bestDist = 1e9;
    for (var j = 0; j < periods.length; j++) {
      var p = periods[j];
      if (p.name !== w.name) continue;
      var dist = w.dn < p.start ? p.start - w.dn : (w.dn > p.end ? w.dn - p.end : 0);
      if (dist < bestDist) { bestDist = dist; best = p; }
    }
    if (best) best.works.push(w.dn);
  }
}

// 연휴가 끝난 뒤 첫 출근일 (주말이면 조정 근무일이 아닌 한 넘긴다)
function returnDay(p) {
  for (var d = p.end + 1; d < p.end + 15; d++) {
    var info = dayInfo[d];
    if (info && info.off) continue;
    if (info && !info.off) return d;
    var wd = ymd(d).day;
    if (wd === 0 || wd === 6) continue;
    return d;
  }
  return p.end + 1;
}

function renderHero(T) {
  var now = null, next = null, i;
  for (i = 0; i < periods.length; i++) {
    var p = periods[i];
    if (p.start <= T && T <= p.end) now = p;
    else if (p.start > T && !next) next = p;
  }

  var el = document.getElementById('hero');
  var html = '';
  if (now) {
    var len = now.end - now.start + 1, nth = T - now.start + 1;
    el.className = 'card hero now';
    html =
      '<div class="hero-row">' +
        '<div class="hero-main">' +
          '<div class="hero-badge">지금 중국은 연휴 중</div>' +
          '<div class="hero-name">' + now.ko + '<span class="cn">' + now.name + '</span></div>' +
          '<div class="hero-range">' + fmtRange(now.start, now.end) + ' · ' + len + '일간 휴무</div>' +
          '<div class="hero-act">업무 복귀 <b>' + fmtMD(returnDay(now)) + '</b> · 그 전까지 방문·연락 자제</div>' +
        '</div>' +
        '<div class="hero-side">' +
          '<div class="hero-dday">' + nth + '/' + len + '</div>' +
          '<div class="hero-dday-sub">연휴 ' + nth + '일째</div>' +
        '</div>' +
      '</div>';
  } else if (next) {
    var dd = next.start - T;
    el.className = 'card hero';
    html =
      '<div class="hero-row">' +
        '<div class="hero-main">' +
          '<div class="hero-badge">다음 중국 연휴</div>' +
          '<div class="hero-name">' + next.ko + '<span class="cn">' + next.name + '</span></div>' +
          '<div class="hero-range">' + fmtRange(next.start, next.end) + ' · ' + (next.end - next.start + 1) + '일간 휴무</div>' +
          '<div class="hero-act"><b>이 기간 방문·연락 피하기</b> · 업무 복귀 ' + fmtMD(returnDay(next)) + '</div>' +
        '</div>' +
        '<div class="hero-side">' +
          '<div class="hero-dday">D-' + dd + '</div>' +
          '<div class="hero-dday-sub">' + (dd === 1 ? '내일부터 연휴' : '연휴 시작까지') + '</div>' +
        '</div>' +
      '</div>';
  } else {
    el.className = 'card hero';
    html =
      '<div class="hero-empty">다음 중국 공휴일 일정이 아직 발표되지 않았습니다.' +
        '<small>중국 국무원이 보통 전년도 11~12월에 발표하며, 발표되면 자동으로 반영됩니다.</small>' +
      '</div>';
  }

  // 다음 조정 근무일: 주말이지만 중국은 출근하는 날이라 따로 알린다
  for (i = 0; i < workDays.length; i++) {
    var w = workDays[i];
    if (w.dn < T) continue;
    var when = w.dn === T ? '오늘' : (w.dn - T === 1 ? '내일' : 'D-' + (w.dn - T));
    html +=
      '<div class="hero-note">' +
        '<span class="note-tag">조정 근무일</span>' +
        '<b>' + fmtMD(w.dn) + ' 중국 정상 출근</b>' +
        koName(w.name) + ' 연휴 대체 근무 · ' + when +
      '</div>';
    break;
  }
  el.innerHTML = html;
}

// 한 달 달력. 다른 달 날짜는 비워서 두 달이 겹쳐 보이지 않게 한다.
function renderMonth(idx, y, mo, T) {
  var first = dnOf(y, mo, 1);
  var nextFirst = mo === 12 ? dnOf(y + 1, 1, 1) : dnOf(y, mo + 1, 1);
  var lead = ymd(first).day;
  var rows = Math.ceil((lead + (nextFirst - first)) / 7);
  var start = first - lead;

  var html = '', offCount = 0;
  for (var i = 0; i < rows * 7; i++) {
    var dn = start + i;
    if (dn < first || dn >= nextFirst) { html += '<div class="day blank"></div>'; continue; }
    var d = ymd(dn), info = dayInfo[dn];
    var cls = 'day', lbl = '';
    if (d.day === 0) cls += ' sun';
    if (d.day === 6) cls += ' sat';
    if (info && info.off) { cls += ' off'; lbl = koName(info.name); offCount++; }
    else if (info) { cls += ' work'; lbl = '출근'; }
    if (dn < T) cls += ' past';
    if (dn === T) cls += ' today';
    html += '<div class="' + cls + '"><span class="num">' + d.d + '</span><span class="lbl">' + lbl + '</span></div>';
  }
  var grid = document.getElementById('calGrid' + idx);
  grid.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
  grid.innerHTML = html;
  // 해당 연도 데이터가 없으면 '없음'이 아니라 아직 발표 전이다
  var known = yearDays[y] && yearDays[y].length;
  document.getElementById('calTitle' + idx).innerHTML =
    y + '년 ' + mo + '월<span>' +
    (!known ? y + '년 공휴일 일정 발표 전' : (offCount ? '공휴일 휴무 ' + offCount + '일' : '공휴일 없음')) + '</span>';
}

function renderList(T) {
  var year = ymd(T).y, html = '', nextMarked = false, count = 0;
  for (var i = 0; i < periods.length; i++) {
    var p = periods[i];
    if (ymd(p.start).y !== year) continue;
    count++;
    var cls = 'hl-row', state;
    if (p.end < T) { cls += ' past'; state = '종료'; }
    else if (p.start <= T) { cls += ' now'; state = '연휴 중'; }
    else {
      state = 'D-' + (p.start - T);
      if (!nextMarked) { cls += ' next'; nextMarked = true; }
    }
    var works = [];
    for (var j = 0; j < p.works.length; j++) works.push(fmtShort(p.works[j]));
    html +=
      '<div class="' + cls + '">' +
        '<div class="hl-name">' + p.ko + '<span class="cn">' + p.name + '</span></div>' +
        '<div class="hl-range">' + fmtShort(p.start) + (p.end !== p.start ? ' ~ ' + fmtShort(p.end) : '') + '</div>' +
        '<div class="hl-len">' + (p.end - p.start + 1) + '일</div>' +
        '<div class="hl-work' + (works.length ? '' : ' none') + '">' + (works.length ? '출근 ' + works.join(', ') : '조정 근무 없음') + '</div>' +
        '<div class="hl-state">' + state + '</div>' +
      '</div>';
  }
  if (!count) html = '<div class="hl-empty">' + year + '년 공휴일 일정이 아직 발표되지 않았습니다.</div>';
  document.getElementById('hlRows').innerHTML = html;
  document.getElementById('listTitle').innerHTML = year + '년 중국 법정 공휴일<span>휴무 기간 · 일수 · 주말 조정 근무일</span>';
  document.getElementById('srcNote').textContent = '출처: 중국 국무원 판공청 ' + year + '년 공휴일 통지';
}

var lastT = null;
function renderAll(force) {
  var z = chinaNow(), k = koreaNow();
  document.getElementById('cnDate').textContent = '중국 현지 · ' + z.mo + '월 ' + z.d + '일 (' + WD[z.day] + ')';
  document.getElementById('cnTime').textContent = pad2(z.h) + ':' + pad2(z.m) + ':' + pad2(z.s);
  document.getElementById('krTime').innerHTML = '한국 <b>' + pad2(k.h) + ':' + pad2(k.m) + '</b> · 중국이 1시간 늦음';
  var T = dnOf(z.y, z.mo, z.d);
  if (!force && T === lastT) return; // 날짜가 바뀔 때만 달력을 다시 그린다
  lastT = T;
  renderHero(T);
  renderMonth(0, z.y, z.mo, T);
  renderMonth(1, z.mo === 12 ? z.y + 1 : z.y, z.mo === 12 ? 1 : z.mo + 1, T);
  renderList(T);
}

// 올해와 내년 데이터를 받는다. 아직 발표 전인 연도는 빈 목록이 오므로 내장 데이터를 유지한다.
function loadYear(y) {
  var idx = 0;
  (function tryNext() {
    if (idx >= DATA_URLS.length) return;
    getJSON(DATA_URLS[idx++].replace('{y}', y), function (err, d) {
      if (err) return tryNext();
      if (d && d.days && d.days.length) {
        yearDays[y] = d.days;
        rebuild();
        renderAll(true);
      }
    });
  })();
}
function refreshData() {
  var y = chinaNow().y;
  loadYear(y);
  loadYear(y + 1);
}

rebuild();
renderAll(true);
setInterval(function () { renderAll(false); }, 1000);
refreshData();
setInterval(refreshData, 6 * 60 * 60 * 1000);

// 1080x1920 디자인을 뷰포트의 가로/세로에 각각 꽉 맞춘다(비율 무시, 여백 없음).
// xtrmCAST 플레이어(가로형 설정)는 웹페이지를 세로 패널과 다른 비율의 영역에
// 그리므로, 여백 없이 채우는 것을 우선한다. 일반 브라우저에서는 찌그러져 보일 수 있다.
// 플레이어가 쿼리스트링을 떼어낼 수 있으므로 #debug=1 형태도 허용한다.
var URL_FLAGS = window.location.search + window.location.hash;
// ?debug=1 : 플레이어 브라우저가 보고하는 뷰포트 값과 뷰포트 경계를 화면에 표시
var DEBUG_MODE = /[?&#]debug=1/.test(URL_FLAGS);

function fitScreen() {
  // CSS 퍼센트가 기준으로 삼는 레이아웃 뷰포트를 우선 사용한다.
  // (window.innerWidth 는 스크롤바/줌/에뮬레이션에서 어긋날 수 있음)
  var d = document.documentElement;
  var w = d.clientWidth || window.innerWidth;
  var h = d.clientHeight || window.innerHeight;
  if (!w || !h) return; // 뷰포트가 0인 상태(숨김/프리로드)에서는 건너뜀
  var sx = w / 1080;
  var sy = h / 1920;
  var el = document.querySelector('.screen');
  var t = 'scale(' + sx + ', ' + sy + ')'; // transform-origin 0 0 기준
  el.style.webkitTransform = t;
  el.style.transform = t;
  if (DEBUG_MODE) renderDebug();
}

function renderDebug() {
  var box = document.getElementById('dbg');
  if (!box) {
    // 자홍색 테두리 = 페이지가 받은 뷰포트의 실제 경계
    var frame = document.createElement('div');
    frame.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;' +
      'border:8px solid #ff00ff;z-index:9998;pointer-events:none;';
    document.body.appendChild(frame);
    box = document.createElement('div');
    box.id = 'dbg';
    box.style.cssText = 'position:fixed;left:16px;top:16px;right:16px;z-index:9999;' +
      'background:rgba(0,0,0,.85);color:#00ff66;font-family:monospace;' +
      'white-space:pre-wrap;word-break:break-all;padding:12px;line-height:1.35;';
    document.body.appendChild(box);
  }
  var d = document.documentElement;
  var el = document.querySelector('.screen');
  var r = el.getBoundingClientRect();
  var ds = d.style;
  box.style.fontSize = Math.max(12, Math.round(Math.min(d.clientWidth, d.clientHeight) / 26)) + 'px';
  box.textContent = [
    'inner   ' + window.innerWidth + ' x ' + window.innerHeight,
    'client  ' + d.clientWidth + ' x ' + d.clientHeight,
    'screen  ' + screen.width + ' x ' + screen.height,
    'dpr     ' + (window.devicePixelRatio || 1),
    'flags   ' + (URL_FLAGS || '(없음)'),
    'tf-css  ' + (('transform' in ds) || ('webkitTransform' in ds)),
    'content ' + Math.round(r.left) + ',' + Math.round(r.top) + '  ' +
      Math.round(r.right - r.left) + ' x ' + Math.round(r.bottom - r.top),
    'ua      ' + navigator.userAgent
  ].join('\n');
}
window.addEventListener('resize', fitScreen);
window.addEventListener('orientationchange', fitScreen);
window.addEventListener('load', fitScreen);
document.addEventListener('visibilitychange', fitScreen);
setInterval(fitScreen, 1000); // 일부 DID 플레이어는 resize 이벤트를 안 보냄
fitScreen();
</script>
</body>
</html>
